# Incidents: what broke, how we found it, and what now guards it (append-only; src/agentic/trust/incident.py)
incidents:
  - id: INC-2026-09-24-cron-tcc
    date: '2026-09-30'
    title: 'Daily runs silently stopped: cron could not read ~/Documents (macOS privacy)'
    found_by: stale data noticed 2026-09-28; ops.daily_run_happened failing
    root_cause: project inside ~/Documents; /usr/sbin/cron not in Full Disk Access
    blast_radius: no scheduled runs 2026-09-24..09-29
    fix: project moved to ~/Code/Zoom; launchd with --if-missed; orchestrator run_sgm.py
    guard_eval: ops.daily_run_happened
    skills:
    - sgm-triage
    lesson: If the daily message did not arrive, check logs/runs/launchd_daily.log and logs/runs/<date>_daily.json first; never
      keep the project under ~/Documents, ~/Desktop or ~/Downloads (macOS blocks background jobs there).
    commit: 9ce7396
