# Incidents: what broke, how we found it, and what now guards it (append-only; src/agentic/trust/incident.py)
incidents:
  - id: INC-2026-09-24-cron-tcc
    date: '2026-09-30'
    title: 'Daily runs silently stopped: cron could not read ~/Documents (macOS privacy)'
    found_by: stale data noticed 2026-09-28; ops.daily_run_happened failing
    root_cause: project inside ~/Documents; /usr/sbin/cron not in Full Disk Access
    blast_radius: no scheduled runs 2026-09-24..09-29
    fix: project moved to ~/Code/Zoom; launchd with --if-missed; orchestrator run_sgm.py
    guard_eval: ops.daily_run_happened
    skills:
    - sgm-triage
    lesson: If the daily message did not arrive, check logs/runs/launchd_daily.log and logs/runs/<date>_daily.json first; never
      keep the project under ~/Documents, ~/Desktop or ~/Downloads (macOS blocks background jobs there).
    commit: 9ce7396
  - id: INC-2026-09-30-insider-feed-silent-zero
    date: '2026-09-30'
    title: 'Promoter/insider trades blank for 5 months: NSE moved the endpoint and the old one answered 0 rows'
    found_by: feature coverage table in EXP-2026-09-30-trait-rules (promoter buys known for 17% of 2026 rows)
    root_cause: NSE switched insider filings to api/corporates-pit-gg on 2026-05-01; the fetcher treated 0 rows as success;
      no freshness eval on insider data
    blast_radius: promoter-buying features and reports blank Mar-Sep 2026
    fix: fetch_pit_gg.py (new endpoint + iXBRL parse, 3,033 filings), daily feed insider_trades
    guard_eval: data.insider_fresh
    skills:
    - sgm-new-data-source
    - sgm-triage
    lesson: A feed that returns 0 rows is broken until the source proves 0 is real (compare the same window a year earlier),
      and every feed gets a freshness eval.
    commit: 524c49a
  - id: INC-2026-09-30-renamed-symbol-cliffs
    date: '2026-09-30'
    title: '62 stocks carried fake one-day crashes: splits/bonuses of renamed companies never applied'
    found_by: per-pick stats (worst pick MAJESCO -92%) -> scan of one-day moves of 45%+
    root_cause: NSE lists corporate actions under the CURRENT symbol; the panel keeps the symbol traded that day; the join was
      by ticker
    blast_radius: 405 cliff rows, 62 stocks; every backtest understated (~3 pts/yr for Sri Lakshmi)
    fix: re-key NSE actions via symbolchange.csv + ISIN issuer; dividends >= 10% adjusted; panel self-healed; guard evals data.no_unexplained_cliffs
      and data.renames_mapped
    guard_eval: data.no_unexplained_cliffs
    skills:
    - sgm-new-data-source
    - sgm-triage
    lesson: Key corporate data by company identity (ISIN issuer + NSE symbolchange.csv), never by ticker alone, and check the
      whole history for one-day moves of 45%+ without an NSE record, not only the new rows.
    commit: 46fa8ee
  - id: INC-2026-09-30-verdicts-on-broken-data
    date: '2026-09-30'
    title: Sri Lakshmi v2 adopted on a pass that did not survive the price fix
    found_by: 'reproduce.py after the corporate-action fix: NOT REPRODUCED (6.8 pts); v2 vs G1 fell to 3/5'
    root_cause: registered tests were run on a price panel with fake crashes
    blast_radius: production rule choice for Friday 2026-10-02
    fix: all key tests re-run on corrected data; v3 vs G1 registered and passed 5/5
    guard_eval: trust.results_reproduce
    skills:
    - sgm-new-idea
    lesson: After any data fix, re-run the registered tests (src/agentic/trust/reproduce.py) and re-check every adopted rule
      before the next live batch; say which verdicts changed.
    commit: 46fa8ee
  - id: INC-2026-09-30-archive-dii-wrong
    date: '2026-09-30'
    title: Restored shareholding archive had institution % wrong before 2022-07
    found_by: archive-vs-XBRL agreement on the overlap (median gap 5.2 pts; CAMLINFINE 0.00 vs 18.65 mutual funds)
    root_cause: old ingest matched only a few category labels in older filings
    blast_radius: would have poisoned the shareholding A/B
    fix: archive institution split used only from 2022-07; XBRL is the single source for the test
    guard_eval: ''
    skills:
    - sgm-new-data-source
    lesson: When restoring or combining two sources, compare them on the overlap first and use only the stretch where they agree.
    commit: bfe47cd
  - id: INC-2026-09-30-xbrl-promoter-member
    date: '2026-09-30'
    title: A promoter's stake was counted as an institution in shareholding XBRL
    found_by: archive-vs-XBRL gap on PNBHOUSING (PNB's 32.64% added to institutions)
    root_cause: IndianFinancialInstitutionsOrBanksMember sits in the promoter table
    blast_radius: institution % overstated for bank-promoted companies
    fix: member excluded from institutions
    guard_eval: ''
    skills:
    - sgm-new-data-source
    lesson: In filings with several tables (shareholding XBRL), check which table a category sits in before summing it; test
      the sum on a known company.
    commit: bfe47cd
  - id: INC-2026-09-30-keyword-substrings
    date: '2026-09-30'
    title: Theme keywords matched inside other words and company names
    found_by: 'match counts: ''housing'' matched 2,531 companies; ''cement'' matched ''announcement'''
    root_cause: regex without word boundaries on text that starts with the company's own name
    blast_radius: theme exposure wrong for most companies in the first build
    fix: word boundaries + company name removed before matching
    guard_eval: ''
    skills:
    - sgm-new-data-source
    - sgm-new-idea
    lesson: 'Keyword matching on filings: match at word boundaries, remove the company''s own name first, and eyeball the match
      counts before using them.'
    commit: bb44f8e
  - id: INC-2026-09-30-api-page-cap
    date: '2026-09-30'
    title: NSE bulk-deal JSON silently capped at 70 rows per request
    found_by: every month returned exactly 70 rows
    root_cause: page cap on the JSON form of the endpoint
    blast_radius: would have kept ~5% of bulk deals
    fix: csv=true form returns the whole month
    guard_eval: ''
    skills:
    - sgm-new-data-source
    lesson: 'A suspiciously round count per request (exactly 70, 100, 500) is a page cap, not the data: find the full export
      before backfilling.'
    commit: 524c49a
  - id: INC-2026-09-30-lessons-not-in-skills
    date: '2026-09-30'
    title: Lessons from failures lived only in commit messages
    found_by: 'user: did we modify skills and evals after the fuck-ups?'
    root_cause: no step turned an incident into a skill lesson and a guard eval
    blast_radius: future sessions would repeat the same mistakes
    fix: src/agentic/trust/incident.py (append-only writer + ledger), skill sgm-incident, eval trust.lessons_intact
    guard_eval: trust.lessons_intact
    skills:
    - sgm-triage
    - sgm-incident
    lesson: 'Every failure ends with src/agentic/trust/incident.py add: a guard eval plus a one-line lesson in each affected
      skill; lessons only in commit messages are forgotten.'
    commit: ''
  - id: INC-2026-09-30-feeds-without-guards
    date: '2026-09-30'
    title: 20 of 26 data feeds had no freshness check; 'script finished' was read as 'data arrived'
    found_by: user asked whether skills/evals are used at all; audit of daily_data_layer.sh vs verify_freshness.py contracts
    root_cause: the new-data-source skill says every feed needs a freshness eval, but skills load only when Claude opens them
      and it did not; nothing checked the rule in code
    blast_radius: any of 20 feeds could go silently empty like the insider feed; corp-actions broadcast_date empty in every
      row
    fix: configs/feed_guards.json (file, date column, allowed age per feed) + eval data.every_feed_guarded (blocks on a feed
      with no guard, warns on stale)
    guard_eval: data.every_feed_guarded
    skills:
    - sgm-new-data-source
    - sgm-triage
    lesson: Add every new feed to configs/feed_guards.json in the same change (file, date column, allowed weekdays); data.every_feed_guarded
      blocks the daily run for a feed without one. Rules that matter go into an eval, not only into a skill.
    commit: ''
  - id: INC-2026-09-30-model-scores-stale
    date: '2026-09-30'
    title: Model scores built once by hand (ended Sep 21) and never rebuilt; market caps also stale and pre-fix
    found_by: user asked about hazards of not retraining; bakeoff_preds.parquet newest date 2026-09-21, mcap_pit 2026-09-25
    root_cause: no scheduled stage rebuilt mcap_pit / anatomy rows / bake-off scores; pit.model_scores_current was weekly and
      warn-only; the screen matched scores within 7 days and gave unscored stocks -inf
    blast_radius: Friday 2026-10-02 G1 list would have been ranked with no model score (arbitrary order); every backtest used
      scores trained on the pre-fix panel
    fix: weekly stage MODEL SCORES (build_mcap_pit -> anatomy_1p5x -> model_bakeoff_1p5x, ~10 min); screen refuses scores >
      7 days old; eval now blocks; scores retrained on corrected prices
    guard_eval: pit.model_scores_current
    skills:
    - sgm-triage
    - sgm-new-data-source
    lesson: Every input a live screen reads (model scores, market caps, industry scores) needs a scheduled rebuild and a check
      that stops the run when it is stale; a warning on a live input is not a guard.
    commit: ''
  - id: INC-2026-09-30-reproduce-pinned-to-prefix
    date: '2026-09-30'
    title: Reproduce check compared only with the first RESULT, so after a data fix it would block every Friday
    found_by: 'reproductions.jsonl: all 3 tests NOT REPRODUCED at 16:04 although RERUN-cafix lines existed; trust.results_reproduce
      is block/weekly'
    root_cause: reproduce.logged() read only <exp>-RESULT, never <exp>-RERUN-<tag>
    blast_radius: Friday 2026-10-02 weekly run would have stopped at the analysis gate (no buy list)
    fix: reproduce compares with the newest RESULT or RERUN; RERUN-rescored logged for 4 tests; all REPRODUCED within 0.05 pts
    guard_eval: trust.results_reproduce
    skills:
    - sgm-new-idea
    lesson: After any data or score rebuild, re-run the registered tests and log <exp>-RERUN-<tag> lines (same rules, no re-tuning),
      then run reproduce.py until it says REPRODUCED before the next Friday.
    commit: ''
  - id: INC-2026-09-30-telegram-letters
    date: '2026-09-30'
    title: A Telegram note went out one letter per line
    found_by: outbox file had 451 lines for a 10-line message
    root_cause: notify.tidy() takes a list of lines and was given one string
    blast_radius: one unreadable message on 2026-09-30 (resent correctly)
    fix: tidy() now splits a string itself
    guard_eval: ''
    skills:
    - sgm-telegram
    lesson: Build messages as a list of lines and check the outbox line count before sending anything by hand.
    commit: ''
  - id: INC-2026-09-30-buy-day-on-holiday
    date: '2026-09-30'
    title: Friday's buy list would have said 'buy Fri Oct 2' — an NSE holiday
    found_by: 'checking the first real-money V3 list: Oct 2 2026 is Gandhi Jayanti; the panel has no holiday rows so data_through
      = Thu Oct 1'
    root_cause: notify and the screen took the next WEEKDAY as the entry day; the repo had no NSE holiday list
    blast_radius: wrong buy day on the first real-money V3 list (sent after the 'buy' day had passed); sell dates off by holidays
    fix: fetch_nse_holidays.py (official NSE holiday-master, daily feed, guarded) + nse_calendar.next_session/add_sessions used
      by notify and the screen
    guard_eval: data.holidays_match_panel
    skills:
    - sgm-telegram
    - sgm-triage
    lesson: Buy and sell days come from NSE's holiday list (src/agentic/nse_calendar.py), never 'next weekday'; check the first
      list after any holiday week by eye.
    commit: ''
  - id: INC-2026-10-02-weekly-freshness-deadlock
    date: '2026-10-02'
    title: 'Friday''s weekly run (first V3 list) blocked: data gate required 15D engine files that only the end of the same
      run refreshes'
    found_by: '❌ Telegram 10:09 AM ET Oct 2 (data.freshness: CS_ENGINE 4/3 business days); user asked why no update'
    root_cause: verify_freshness gated the weekly run on 15D engine outputs (written Sun Sep 28 by the 15D step, which runs
      after Sri Lakshmi), so from Thursday on they were always stale = deadlock every Friday; staleness counted weekdays, so
      the Oct 2 NSE holiday added a day
    blast_radius: first real-money V3 list held at 10:09 AM ET Oct 2; would have blocked every Friday
    fix: data gate checks core inputs only (SGM_FRESH_CORE=1 skips the 6 15D engine outputs; the 15D step keeps the full check);
      staleness counted in NSE sessions via nse_calendar; weekly re-run manually 10:42 AM ET
    guard_eval: data.freshness
    skills:
    - sgm-triage
    - sgm-new-data-source
    lesson: A gate may only require inputs that are produced before it runs; outputs refreshed later in the same run belong
      to that later step's own check. Count file age in NSE sessions (nse_calendar), never plain weekdays.
    commit: ''
