    commit: 585d4f3
  - id: INC-2026-10-13-monday-feeds-stale
    date: '2026-10-13'
    title: Monday feeds (fundamentals, security master) stale 11 trading days
    found_by: Daily QC warning data.every_feed_guarded (Oct 9-13), raised by the user ('qc fix hua?')
    root_cause: (1) The 45-min per-step limit added 2026-10-06 is shorter than the Screener fundamentals fetch (~77 min), which
      wrote only at the end, so every Monday it was killed with nothing saved. (2) build_security_master warmed its NSE session
      with referer 'https://www.nseindia.com/' (trailing slash), so the session's allowance for NSE's 403 on the bare home page
      never applied and one 403 failed the step.
    blast_radius: Not used by V3.2 picks (only the rename list feeds the new-listing flag); market-cap backfill and old reports
      read the fundamentals. Warnings only, no blocked run.
    fix: Security master fetches nsearchives CSVs with build_session() like the bhavcopy downloader; fundamentals saves every
      50 stocks, resumes, and runs Saturdays after the weekend note with a 2.5 h limit.
    guard_eval: data.every_feed_guarded
    skills:
    - sgm-triage
    - sgm-new-data-source
    lesson: When adding a time limit to every step, compare it with each step's normal duration first, and make long fetches
      save as they go; a QC warning that repeats for a week is a failure, not a warning.
    commit: 39442a6
  - id: INC-2026-10-16-reproduce-blocks-on-market-drift
    date: '2026-10-16'
    title: Friday buy list blocked two weeks running by the reproduce gate reacting to market movement
    found_by: Weekly run stopped at the weekly analysis check on 2026-10-09 and 2026-10-16 (7:54 PM IST); user asked why the
      list did not come
    root_cause: trust.results_reproduce compared this week's re-run of the registered tests with numbers logged the previous
      week; a week of prices plus the model-score rebuild moves them 1.6-3.6 points, beyond the 1-point drift allowance, and
      the V3.2 test's wiring check chained the failure. The gate required numbers that only exist after the week's data is in.
    blast_radius: No list sent at the scheduled time on Oct 9 and Oct 16 (sent by hand at 01:57 and 22:32 IST after re-runs).
      Picks themselves were unaffected.
    fix: RERUN stage re-runs the registered tests on the week's data before the gate; trust.live_rule_verdicts blocks only if
      V3.1/V3.2 stop winning; trust.verdict_changes warns on other verdict changes; REPRODUCE compares with the fresh numbers.
    guard_eval: trust.live_rule_verdicts
    skills:
    - sgm-triage
    - sgm-new-idea
    lesson: 'A check that compares results across weeks must separate code drift from data drift: re-run on this week''s data
      first, block on verdict flips of the live rule, and reproduce against the fresh numbers.'
    commit: '9466883'
  - id: INC-2026-10-17-rename-history-gap
    date: '2026-10-17'
    title: Renamed companies lost their price history in the V3 screen for up to a year
    found_by: User asked whether Zomato / Swiggy / Meesho are in the universe (2026-10-16); ETERNAL's 1-year return and 200-day
      average were blank for months after the ZOMATO rename
    root_cause: Returns were stitched across renames (research_panel.stitch_renames), but the screen's trend features (ret60/ret252
      in sim_leader_portfolio_7x.load, lo252 and the panel's sma_50/sma_200 in sim_screen_rank_exit.features) were computed
      per symbol, so a successor started with no history; renamed successors were also kept out of the new-listing exemption.
    blast_radius: 132 renamed stocks, 4,545 liquid stock-weeks since Apr 2019 could not pass the trend test (ETERNAL, TMPV,
      LTM, GVT&D, HBLENGINE, GMRAIRPORT ...). V3.2 backtest 57.8 -> 57.1 after the fix, verdicts unchanged; this week's picks
      unchanged.
    fix: research_panel.with_history prepends predecessor rows for feature computation in load() and features(); industry scores
      rebuilt; registered tests re-run (renamefix-20261017). Model builder features still per symbol (debt ledger).
    guard_eval: strategy.renames_keep_history
    skills:
    - sgm-triage
