    found_by: Abhinav asked 'do we have systems to robustly fetch all inputs ... and health'; the inputs check showed order_amounts
      and pnl_quarterly ending Aug 29
    root_cause: The three tables were built by hand for research (parse_order_amounts / fetch_order_fulltext, fetch_pnl_history,
      build_event_ledger) and never added to daily_data_layer.sh or feed_guards.json; fetch_pnl_history also skips a company
      forever once fetched, so it could not update even if run
    blast_radius: Big-order explorations and registered tests used data through Aug 29 (results as of then are unaffected);
      the daily orders digest computes amounts on the fly so the daily message was correct; V3 does not read these tables
    fix: 'daily_data_layer.sh: announcements_archive -> order_amounts (20-min cap) -> event_ledger -> pnl_update (new update_pnl_incremental.py,
      40-min cap); feed guards for all four; data.input_chain eval + message line checks ran -> fetched (vs NSE''s whole-day
      count) -> used every day'
