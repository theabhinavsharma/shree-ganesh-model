# SGM / Sri Lakshmi eval registry — the human-readable spec every coded check hangs off (2026-09-29).
#
# Each eval is written in plain English FIRST: what must be true, why it matters (the harm or the incident it came
# from), where the right answer comes from, the threshold, and what happens when it fails. `check` names the function
# in src/agentic/eval_checks.py that implements it, or `human` when a person has to judge it.
#   action   block = stop the run / no picks / no real money until fixed;  warn = proceed, say it in the message;
#            log = record only
#   cadence  daily | weekly | per_experiment | per_retrain
#   owner    system (automatic) | abhinav (human judgement) | claude (review / triage)
# Runner: /usr/bin/python3 src/agentic/run_evals.py [--cadence daily|weekly|all]
# Output: reports/eval_report_<date>.md (statement next to result) + logs/evals/eval_run_<date>.json; exit 1 on a
# failed `block` eval.

evals:

  # ---------------------------------------------------------------- data: is the data true?
  - id: data.coverage
    statement: "Every stock in NSE's own daily file for the latest session is in our price panel, with the same closing price to the paisa."
    why: "On 2026-09-08 a series filter silently dropped ~270 BE/BZ stocks a day for two weeks while every freshness check stayed green."
    source_of_truth: "NSE bhavcopy for that session (raw file on disk)"
    threshold: "coverage >= 99.5%, 0 BE/BZ series regressions, 0 closing-price mismatches"
    action: block
    cadence: daily
    owner: system
    check: coverage

  - id: data.freshness
    statement: "Every input the pipeline reads is younger than its declared maximum age, file by file and column by column."
    why: "Feeds rotted silently before (FRED 55 days, corporate actions 113 days, a scheduler dead for 4 months)."
    source_of_truth: "the contracts in src/agentic/verify_freshness.py"
    threshold: "0 stale files, 0 stale columns"
    action: block
    cadence: daily
    owner: system
    check: freshness

  - id: data.no_duplicates
    statement: "Each stock has at most one row per trading day in the price panel."
    why: "A duplicate day double-counts a return and breaks every wide price table."
    source_of_truth: "the panel itself"
    threshold: "0 duplicate (symbol, date) rows"
    action: block
    cadence: daily
    owner: system
    check: no_duplicates

  - id: data.no_holiday_copies
    statement: "None of the last 20 sessions is a copy of the session before it."
    why: "NSE serves the previous day's file under a holiday's name; 155,999 phantom rows on 76 holidays were found on 2026-09-27."
    source_of_truth: "the panel: share of rows whose open, high, low, close equal the prior session's"
    threshold: "no session with >= 90% of rows repeating the prior session"
    action: block
    cadence: daily
    owner: system
    check: no_holiday_copies

  - id: data.ca_before_prices
    statement: "Corporate actions were refreshed before prices in the latest daily run."
    why: "A split or bonus that lands after prices corrupts adjusted history (159 stocks once)."
    source_of_truth: "the order of steps in logs/daily_data_layer_status.json"
    threshold: "corp_actions passed and appears before prices"
    action: block
    cadence: daily
    owner: system
    check: ca_before_prices

  - id: data.insider_fresh
    statement: "Promoter and insider trade disclosures are current: the newest one is at most 5 days old."
    why: "NSE moved these filings to a new system on 1 May 2026 and our old feed returned nothing for 5 months without an error. Promoter buying is one of the few signals that separated winners."
    source_of_truth: "data/derived/pit_history.parquet column date (NSE broadcast time), fed by src/agentic/fetch_pit_gg.py"
    threshold: "newest disclosure within 5 calendar days of today"
    action: warn
    cadence: daily
    owner: system
    check: insider_fresh

  - id: data.insider_no_empty_month
    statement: "Every month from January 2019 to last month has promoter / insider trade disclosures in the history file."
    why: "March and April 2026 fell between NSE's old and new insider systems and were missing for 5 months without any check noticing; the model rows read 'no promoter trades' for every stock in those weeks (INC-2026-10-12-insider-gap-mar-apr-2026)."
    source_of_truth: "data/derived/pit_history.parquet column date, rebuilt daily by src/agentic/fetch_pit_gg.py merge_history (old history + data/raw/pit_gap_2026 + new system)"
    threshold: "zero empty months"
    action: block
    cadence: daily
    owner: system
    check: insider_no_empty_month

  - id: data.no_unexplained_cliffs
    statement: "No stock we could buy shows a one-day fall of 45% or more in its whole history unless NSE recorded a corporate action that day or the crash is verified real."
    why: "Unapplied splits, bonuses and special dividends looked like crashes in 62 stocks until 2026-09-30 (renamed companies, Majesco's Rs 974 dividend). Daily checks only looked at new rows, so old history rotted silently."
    source_of_truth: "adjusted panel vs corporate-actions store + price_only_ca_factors; verified real crashes in evals/verified_real_crashes.csv"
    threshold: "0 unexplained cliffs in core-band stocks (20d ADV >= Rs 5 cr and price > Rs 50 the day before)"
    action: block
    cadence: daily
    owner: system
    check: no_unexplained_cliffs

  - id: data.renames_mapped
    statement: "Every corporate action NSE lists under a company's new symbol is also applied to the symbol it traded under before the rename."
    why: "NSE lists actions under the current symbol; the price history keeps the old one. 1,517 actions were re-keyed on 2026-09-30."
    source_of_truth: "NSE symbolchange.csv + symbol_isin_history.parquet vs stock_corporate_actions.parquet (mapped_from_symbol)"
    threshold: "0 split/bonus actions dated before a rename without a copy under the old symbol"
    action: block
    cadence: daily
    owner: system
    check: renames_mapped

  - id: data.manifests
    statement: "Every derived table the strategy reads has a manifest that states its units and its source."
    why: "Units were guessed from column names twice: P&L in rupee lakh vs rupees; a 'delivery %' column that holds fractions."
    source_of_truth: "the .manifest.json next to each table"
    threshold: "all listed tables have a manifest with units or columns described"
    action: warn
    cadence: daily
    owner: system
    check: manifests

  # ---------------------------------------------------------------- point in time: is the test honest?
  - id: pit.filings_after_period
    statement: "No quarterly result is dated as filed before its quarter ended, and no order filing is dated after we fetched it."
    why: "A filing date earlier than the period it reports means the backtest can see results before they were public."
    source_of_truth: "pnl_quarterly (quarter_end, filing_dt); order_daily (ts, fetched)"
    threshold: "0 violations"
    action: block
    cadence: daily
    owner: system
    check: filings_after_period

  - id: pit.model_scores_current
    statement: "The model scores used by this week's screen are at most 7 days old."
    why: "The screen ranks unscored stocks last; stale scores quietly turn the model ranking into an arbitrary one."
    source_of_truth: "bakeoff_preds.parquet latest trade_date vs the panel's last session"
    threshold: "<= 7 calendar days"
    action: block
    history: "2026-09-30 warn -> block: the scores were built once by hand (ended 2026-09-21) and nothing rebuilt them; Friday's list would have ranked every stock with no score (INC-2026-09-30-model-scores-stale). Now rebuilt weekly (run_sgm MODEL SCORES) and the screen refuses stale scores."
    cadence: weekly
    owner: system
    check: model_scores_current

  # ---------------------------------------------------------------- provenance / hallucination guards
  - id: prov.external_rows_sourced
    statement: "Every row in the datasets built from government sources carries the URL it came from and the date it was published."
    why: "Numbers collected by agents must be traceable to an official document; an unsourced number is treated as invented."
    source_of_truth: "budget_capex, iip_monthly, core_sector_monthly, pib_releases"
    threshold: "0 rows without a source URL or a publication date"
    action: block
    cadence: daily
    owner: system
    check: external_rows_sourced

  - id: prov.order_amount_grounded
    statement: "Every order amount we report can be found, as written, in the filing text it was extracted from."
    why: "An extractor that returns a number the filing never states is a hallucination, even if no language model was involved."
    source_of_truth: "the stored snippet / headline of each order filing"
    threshold: ">= 98% of amounts grounded (number x its written unit reproduces the stored crore value within 2%)"
    action: warn
    cadence: daily
    owner: system
    check: order_amount_grounded

  # ---------------------------------------------------------------- model and strategy: does it work?
  - id: model.ranking_lift
    statement: "On the most recent fully labelled year, the model's weekly top-10 liquid picks touch +50% at least 1.5 times as often as the average liquid stock."
    why: "The model's job is ranking inside a week; below 1.5x it is not earning its complexity over the rules."
    source_of_truth: "bakeoff_preds.parquet (walk-forward, out-of-sample) and the realised 95-session labels"
    threshold: "lift >= 1.5"
    action: warn
    cadence: weekly
    owner: system
    check: ranking_lift

  - id: strategy.preregistered
    statement: "Every experiment with a result in the log was registered earlier, with its pass rule, before the result was written."
    why: "Rules written after seeing results are grading our own homework; that is how backtests lie."
    source_of_truth: "logs/experiments.jsonl (REGISTERED line vs RESULT line, timestamps)"
    threshold: "0 results without an earlier registration (experiments from 2026-09-27 on)"
    action: block
    cadence: per_experiment
    owner: system
    check: preregistered

  # ---------------------------------------------------------------- output: is it safe to act on?
  - id: output.screens_immutable
    statement: "A weekly screen, once saved, is never rewritten (only exception: a swap recorded in logs/evals/screen_replacements.jsonl with old and new hash, the old file kept, made before the batch's entry session)."
    why: "An off-schedule run once overwrote a committed basket; the paper record is only honest if picks cannot change after the fact."
    source_of_truth: "content hash of each screen file, recorded the first time it is seen"
    threshold: "0 changed screens"
    action: block
    cadence: daily
    owner: system
    check: screens_immutable

  - id: output.one_screen_per_week
    statement: "Each track has at most one screen per calendar week."
    why: "Two batches in one week double the capital in that week's names and break the 1/26 ladder."
    source_of_truth: "logs/leader_sleeve/screen_*.json, logs/model_screen/screen_*.json"
    threshold: "0 weeks with more than one screen"
    action: block
    cadence: daily
    owner: system
    check: one_screen_per_week

  - id: output.message_grounded
    statement: "The last phone message passed its number check before it was sent: every number traced to a file, date right, every pick listed."
    why: "A message is what you act on from your phone. A wrong number there is worse than a wrong number in a log."
    source_of_truth: "logs/outbox/checks.jsonl (src/agentic/trust/check_message.py, run by src/agentic/run_sgm.py before every send)"
    threshold: "latest daily or weekly check ok"
    action: warn
    cadence: daily
    owner: system
    check: message_grounded

  - id: output.paper_scored
    statement: "Every open paper batch was scored through the latest session."
    why: "An unscored batch hides losses and makes the forward record look better than it is."
    source_of_truth: "outcomes.jsonl scored_through vs the panel's last session"
    threshold: "all open batches scored through the last session (entry-pending batches excepted)"
    action: warn
    cadence: daily
    owner: system
    check: paper_scored

  - id: ops.daily_run_happened
    statement: "The daily data run finished for the latest weekday."
    why: "The scheduler died silently three times; the only protection is an alarm when a run did not happen at all."
    source_of_truth: "logs/daily_data_layer_status.json date"
    threshold: "status date = the latest weekday that has NSE data"
    action: block
    cadence: daily
    owner: system
    check: daily_run_happened

  - id: backup.drive_checksums
    statement: "The latest Google Drive backup matches its manifest checksums, file by file."
    why: "A backup that was never verified is a hope, not a backup."
    source_of_truth: "full_manifest.json sha256 in My Drive/SGM backups/backup/<date>"
    threshold: "all volumes match"
    action: block
    cadence: weekly
    owner: system
    check: drive_checksums

  # ---------------------------------------------------------------- trust: is Claude telling the truth about all this?
  - id: trust.claims_sourced
    statement: "When Claude states a number to Abhinav, that number appears in a file, a command output or his own message from the same session."
    why: "Claude can type a confident, wrong number. A number with no receipt is the most common way that happens."
    source_of_truth: "logs/trust/claims.jsonl (written by the Stop hook src/agentic/trust/claim_check.py after every reply)"
    threshold: "5% or fewer of numbers without a receipt over the last 7 days"
    action: warn
    cadence: daily
    owner: system
    check: claims_sourced

  - id: trust.results_reproduce
    statement: "Re-running each registered test from the committed code gives the logged numbers again."
    why: "A result that only existed in one chat session is not a result. This catches edited code, lost data and copy-paste errors."
    source_of_truth: "logs/trust/reproductions.jsonl (src/agentic/trust/reproduce.py) vs the newest RESULT / RERUN line in logs/experiments.jsonl (from 2026-10-16 the Friday run's own RERUN stage, same data)"
    threshold: "every test REPRODUCED (within 0.1 point) or DRIFTED (within 1 point after a data refresh); re-checked within 35 days"
    action: block
    cadence: weekly
    owner: system
    check: results_reproduce

  - id: trust.live_rule_verdicts
    statement: "The registered tests the live rule stands on still pass on this week's data: V3.1 beats V3 (EXP-2026-10-11-v3-l1-newlist-cost, V3_L1Nc) and V3.2 beats V3.1 (EXP-2026-10-12-v31-t2t, V3.1_NOT2T)."
    why: "Added 2026-10-16. The Friday run re-runs the registered tests on the week's data before the list (trust/rerun_registered.py). Market movement shifts the numbers every week; what must not change silently is whether the rule we invest with still wins (INC-2026-10-16-reproduce-blocks-on-market-drift)."
    source_of_truth: "newest RESULT / RERUN line per test in logs/experiments.jsonl; arms in src/agentic/trust/reproduce.py LIVE_ARMS"
    threshold: "every live arm in its test's newest verdict"
    action: block
    cadence: weekly
    owner: system
    check: live_rule_verdicts

  - id: trust.verdict_changes
    statement: "No registered verdict changed since the previous run; any change is listed so it is looked at, not missed."
    why: "Added 2026-10-16. Verdicts that are not the live rule's own (e.g. the financials drop on the old G1 base went from 5/5 to 2/5 on Oct 16) should be seen without blocking the list."
    source_of_truth: "logs/experiments.jsonl: newest RESULT / RERUN line vs the newest line of an earlier run, for every test in reproduce.TESTS"
    threshold: "no change (a change is a warning)"
    action: warn
    cadence: weekly
    owner: system
    check: verdict_changes

  - id: strategy.renames_keep_history
    statement: "A renamed company keeps its price history in the screen: after ZOMATO became ETERNAL, the 1-year return and 200-day average still count the ZOMATO days."
    why: "Added 2026-10-17 (INC-2026-10-17-rename-history-gap). The screen built those features per symbol, so for up to a year after a rename a company could not pass the trend test: 132 renamed stocks, 4,545 liquid stock-weeks since 2019 (ETERNAL, TMPV, LTM, GVT&D, HBLENGINE ...)."
    source_of_truth: "sim_leader_portfolio_7x.load + sim_screen_rank_exit.features (research_panel.with_history) on every rename of the last 2 years whose predecessor traded >= 252 sessions"
    threshold: "every such successor's latest row has ret252 and sma_200"
    action: block
    cadence: weekly
    owner: system
    check: renames_keep_history

  - id: trust.claude_golden
    statement: "A fresh Claude session answers the golden questions about this system correctly, including saying 'that does not exist' to trap questions."
    why: "Measures Claude's hallucination rate on this project directly instead of guessing it."
    source_of_truth: "evals/assistant_golden.yaml graded by src/agentic/trust/run_assistant_golden.py -> logs/trust/golden_runs.jsonl"
    threshold: "90% or more correct on the latest run"
    action: warn
    cadence: weekly
    owner: system
    check: claude_golden

  - id: trust.lessons_intact
    statement: "Every eval, incident and skill lesson ever recorded is still there."
    why: "Lessons from failures must not quietly disappear when someone edits a file; an edit may only add."
    source_of_truth: "evals/.lessons_ledger.json vs evals/registry.yaml, evals/incidents.yaml, .claude/skills/*/SKILL.md"
    threshold: "nothing missing"
    action: block
    cadence: daily
    owner: system
    check: lessons_intact

  # ---------------------------------------------------------------- human judgement: what code cannot decide
  - id: human.order_book_golden
    statement: "On a sample of 50 investor-deck filings graded by a person, the extracted figure is the filing's total order book at least 80% of the time."
    why: "Only a person reading the filing can say whether a number is the total book, a segment, an inflow or a market-size claim; automated grading must be calibrated against this."
    source_of_truth: "evals/golden/order_book_to_grade.csv, graded by Abhinav"
    threshold: ">= 80% correct (within 5% of the stated total book)"
    action: warn
    cadence: monthly
    owner: abhinav
    check: order_book_golden

  - id: human.weekly_pick_review
    statement: "Before real money moves, a person has read each weekly batch and signed off that no pick is a takeover target, carries a fraud or governance red flag, or has an unexplained price spike."
    why: "Takeovers and governance events break the momentum pattern the model learned (TBZ's open offer); code flags them, a person decides."
    source_of_truth: "evals/human_review/<track>_<screen_id>.md, from the template, all boxes ticked"
    threshold: "a signed review exists for the latest batch of each track"
    action: block
    cadence: weekly
    owner: abhinav
    check: weekly_pick_review

  - id: data.every_feed_guarded
    statement: "Every data feed has its own freshness check, and each feed's newest row is recent."
    why: "A feed script can finish without error and still bring nothing new. The insider feed did that for 5 months (INC-2026-09-30-insider-feed-silent-zero). On 2026-09-30 only 6 of 26 feeds had a freshness check."
    source_of_truth: "configs/feed_guards.json (file, date column, allowed age per feed) vs the run list in src/agentic/daily_data_layer.sh"
    threshold: "every feed listed in the guard file (else blocks); newest row within its allowed weekdays (else warning)"
    action: block
    cadence: daily
    owner: system
    check: every_feed_guarded

  - id: data.input_chain
    statement: "Every strategy input ran today, fetched the whole day (as many filings as NSE's own count), and the day's rows reached the tables built from them (order amounts, bad-news ledger, P&L)."
    why: "Order amounts, P&L and the bad-news ledger had no schedule and sat 5 weeks stale with nothing flagging it (found 2026-10-04). A step can run and fetch yet the table built from it can still miss the day."
    source_of_truth: "src/agentic/trust/input_chain.py vs NSE's corporate-announcements whole-day count; logs/evals/input_chain_<day>.json"
    threshold: ">= 95% of NSE's count fetched; >= 95% of the day's order filings and results companies used downstream"
    action: warn
    cadence: daily
    owner: system
    check: input_chain

  - id: data.pledge_feed
    statement: "Promoter pledge and release events from NSE (SAST Regulation 31) are on file for every month since January 2016, and new events arrived in the last 30 days."
    why: "Input to the leverage test (T2): a newly pledged promoter stake is a forced-selling risk. NSE's 'Pledged Data' endpoint returns nothing, so this feed uses the Regulation 31 disclosures; an empty month must show, not pass silently."
    source_of_truth: "data/raw/pledge_events/<month>.json (NSE api/corporate-pledgedata-sast3132), data/derived/pledge_events.parquet"
    threshold: "0 months missing since 2016-01; > 0 events in the last 30 days"
    action: warn
    cadence: daily
    owner: system
    check: pledge_feed

  - id: data.nsdl_fpi_feed
    statement: "Daily foreign portfolio investor (FPI) flows from NSDL's FPI Monitor are on file for every month since January 2015, each completed month has at least 12 reporting dates, and every date adds up the way NSDL prints it."
    why: "NSE's own FII/DII page only serves the last ~30 days, so history comes from NSDL (the depository's official record of confirmed FPI trades). Used to test whether foreign selling marks weak V3.1 lists (2026-10-12)."
    source_of_truth: "data/raw/nsdl_fpi/fpi_daily_<YYYY-MM>.html (https://www.fpi.nsdl.co.in/web/Reports/Archive.aspx), data/derived/nsdl_fpi_daily.parquet"
    threshold: "0 months missing since 2015-01; 0 thin months; 0 dates whose routes or sub-totals do not add up (Rs 1 crore tolerance)"
    action: warn
    cadence: daily
    owner: system
    check: nsdl_fpi_feed

  - id: data.nsdl_fpi_sector_feed
    statement: "NSDL's fortnightly sector-wise FPI reports from 2015 on are all parsed, at least 99% add up to NSDL's own Grand Total within Rs 5 crore, and the newest report is at most 25 days old (9 unparsed and 3 off-total reports from 2012-2013 are listed in the manifest; no test uses them)."
    why: "Input to the sector-tilt test (EXP-2026-10-12-v31-fpi-sector-tilt): which sectors foreign investors are buying or leaving. NSDL changed its sector list around 2022, so a format change must show, not pass silently."
    source_of_truth: "data/raw/nsdl_fpi_sector/FIIInvestSector_*.html (https://www.fpi.nsdl.co.in/web/Reports/FPI_Fortnightly_Selection.aspx), data/derived/nsdl_fpi_sector.parquet + manifest"
    threshold: ">= 99% of reports reconcile; 0 unparsed; newest report <= 25 days old"
    action: warn
    cadence: daily
    owner: system
    check: nsdl_fpi_sector_feed

  - id: data.value_removal_held
    statement: "No live Sri Lakshmi holding goes through a big payout or demerger (applied price-only factor < 0.5) unflagged, and the backtest's exposure to such events is reported until the engine treats them as cash."
    why: "INC-2026-10-12-payout-reinvested-in-stub: the adjusted series reinvests a 98.8% payout (MAJESCO, Dec 2020) into the leftover stub, turning a ~+40% return into +837% in the backtest and in model labels; the one-day-jump checks cannot see it (the series is smooth)."
    source_of_truth: "data/corporate_actions_full_history/normalized/price_only_ca_factors.parquet (applied, price_factor < 0.5), logs/sri_lakshmi/screen_*.json, logs/leader_sleeve/v31_hits_by_year/v31_picks.csv"
    threshold: "0 live holdings through such an event without a note; backtest pick-weeks reported (0 once the engine fix lands)"
    action: warn
    cadence: daily
    owner: system
    check: value_removal_held

  - id: ops.watchdog_alive
    statement: "The independent watchdog checked in within the last 2 hours (it kills runs stuck over 4 hours and alerts when a daily or weekend message is missing)."
    why: "On 2026-10-05 the Mac lost internet, the daily run hung for over a day, launchd would not start the next runs, and no message or alarm went out until the user noticed (INC-2026-10-06-daily-run-hung-silent)."
    source_of_truth: "logs/runs/watchdog_heartbeat.json written by src/agentic/watchdog.py"
    threshold: "heartbeat <= 2 hours old"
    action: warn
    cadence: daily
    owner: system
    check: watchdog_alive

  - id: data.holidays_match_panel
    statement: "NSE's trading-holiday list covers this year and agrees with our price data (no prices on a listed holiday, no weekday missing unless NSE lists it)."
    why: "Buy and sell days in messages come from this list. Without it, a list built on Thu 2026-10-01 would have said buy on Fri Oct 2, a holiday (INC-2026-09-30-buy-day-on-holiday)."
    source_of_truth: "data/derived/nse_holidays.parquet (NSE api/holiday-master, segment CM) vs the price panel's trade dates"
    threshold: "current year present; 0 disagreements"
    action: block
    cadence: daily
    owner: system
    check: holidays_match_panel

  - id: trust.results_data_ready
    statement: "No A/B result is computed on data below the bar: every result logged from 2026-10-02 has a passing data-readiness check before it, the same day."
    why: "Garbage in, garbage out. The P&L test (EXP-2026-09-30-v3-pnl-full) gave a verdict on P&L that was 85-90% complete for 2015-17, unverifiable for 2025-26 and filled in 20-75% of rows in 2016-19 (INC-2026-10-02-ab-on-incomplete-data)."
    source_of_truth: "logs/experiments.jsonl: <EXP>-DATA-READY lines written by src/agentic/trust/data_ready.gate() vs RESULT / RERUN lines; the bar in configs/data_bar.json"
    threshold: "0 results without a READY line"
    action: warn
    cadence: daily
    owner: system
    check: results_data_ready
