<style>
/* Layout: one full-screen 3D globe; a quiet title top-left, fly-to chips along the bottom, a card that opens on the right (bottom sheet on phones). */
:root {
  --sky-1: #f6e2cd;   /* warm peach sky */
  --sky-2: #d6e6e2;   /* misty teal horizon */
  --ink: #2b2521;
  --ink-2: #6b6058;
  --panel: #fffaf3;
  --panel-edge: #e8d6c1;
  --accent: #1d6b73;  /* deep teal for controls */
  --accent-ink: #ffffff;
  --live: #3a8752;    /* feeds the live rule */
  --msg: #2f6fae;     /* messages */
  --ctx: #9a6a2c;     /* context and research */
  --off: #978b82;     /* not in use */
  --font-display: "Fredoka", "Avenir Next Rounded", "Nunito", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-1: #2a2337; --sky-2: #15242b; --ink: #f4ece3; --ink-2: #b8aca2; --panel: #221d27; --panel-edge: #3b3242;
    --accent: #6cc2c8; --accent-ink: #0e1c1f; --live: #72c38b; --msg: #7fb3e6; --ctx: #e0ad62; --off: #8d8389; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-1: #2a2337; --sky-2: #15242b; --ink: #f4ece3; --ink-2: #b8aca2; --panel: #221d27; --panel-edge: #3b3242;
  --accent: #6cc2c8; --accent-ink: #0e1c1f; --live: #72c38b; --msg: #7fb3e6; --ctx: #e0ad62; --off: #8d8389; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  background: radial-gradient(120% 90% at 30% 10%, var(--sky-1), var(--sky-2));
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.ui { position: fixed; z-index: 2; }
header.ui {
  top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(440px, calc(100% - 140px)); pointer-events: none;
}
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 4vw, 38px); line-height: 1.05; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 38ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
#aboutBtn {
  top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; cursor: pointer; }
.pill {
  border: 1px solid var(--panel-edge); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 7px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;
}
.pill:hover { border-color: var(--accent); }
.pill:focus-visible, .card button:focus-visible, .card a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
nav.ui {
  left: 0; right: 0; bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.hint { font-size: 12px; color: var(--ink-2); pointer-events: none; }
.label {
  position: fixed; left: 0; top: 0; z-index: 1; pointer-events: auto; cursor: pointer; transform: translate(-50%, -100%);
  font-family: var(--font-display); font-weight: 600; font-size: 13px; line-height: 1.1; color: var(--ink);
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--panel-edge); border-radius: 10px;
  padding: 4px 9px 5px; white-space: nowrap; text-align: center; transition: opacity .25s;
}
.label small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--ink-2); }
.label.minor { font-size: 11px; padding: 2px 7px; font-family: var(--font-body); font-weight: 500; color: var(--ink-2); }
#tip {
  position: fixed; z-index: 3; pointer-events: none; transform: translate(12px, 12px); background: var(--ink); color: var(--panel);
  font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; white-space: nowrap;
}
#bubble {
  position: fixed; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); max-width: min(260px, 70vw);
  background: var(--panel); color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 14px; padding: 9px 12px;
  font-size: 13px; line-height: 1.4; box-shadow: 0 6px 18px rgba(40, 25, 10, .14);
}
#bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--panel);
  border-right: 1px solid var(--panel-edge); border-bottom: 1px solid var(--panel-edge); transform: translateX(-50%) rotate(45deg);
}
.card {
  position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 64px); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(380px, calc(100% - 32px)); max-height: calc(100% - 170px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 18px; padding: 18px 18px 16px;
  box-shadow: 0 14px 40px rgba(40, 25, 10, .18);
}
.card h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.1; margin: 0 34px 4px 0; text-wrap: balance; }
.card .role { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.card .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--panel-edge); background: transparent; color: var(--ink); font-size: 18px; line-height: 1; }
.card blockquote { margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, var(--panel)); font-size: 14px; }
.card dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 10px; }
.card dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.card dd { margin: 2px 0 0; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.card ul { margin: 2px 0 0; padding-left: 18px; }
.card li { margin: 1px 0; }
.card a { color: var(--accent); }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; margin-bottom: 10px; }
.tag.live { color: var(--live); } .tag.msg { color: var(--msg); } .tag.ctx { color: var(--ctx); } .tag.off { color: var(--off); }
.botlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.botlist button { border: 1px solid var(--panel-edge); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.botlist button:hover { border-color: var(--accent); }
.note { font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; font-family: var(--font-display); font-size: 18px; color: var(--ink-2); pointer-events: none; }
@media (max-width: 640px) {
  header.ui { max-width: calc(100% - 110px); }
  header p { font-size: 13px; }
  .legend { display: none; }
  .card { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); max-height: 58%; border-radius: 18px; }
}
@media (max-width: 640px) { body.card-open header.ui { opacity: 0; } }
body.compact .label small { display: none; }
header.ui { transition: opacity .2s; }
@media (prefers-reduced-motion: reduce) { .label, header.ui { transition: none; } }
</style>

  // keep the open card off the subject: shift the picture left (desktop) or up (phone sheet)
  const wide = window.innerWidth > 640, cardOpen = !cardEl.hidden;
  const wantX = cardOpen && wide ? (cardEl.offsetWidth + 16) / 2 : 0, wantY = cardOpen && !wide ? cardEl.offsetHeight / 2 : 0;
  viewShift.x += (wantX - viewShift.x) * Math.min(1, dt * 6); viewShift.y += (wantY - viewShift.y) * Math.min(1, dt * 6);
  if (Math.abs(viewShift.x) > 0.5 || Math.abs(viewShift.y) > 0.5) camera.setViewOffset(window.innerWidth, window.innerHeight, viewShift.x, viewShift.y, window.innerWidth, window.innerHeight);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
  clouds.rotation.y += dt * 0.012 * speed;
  Object.values(stationObjs).forEach((st, i) => { st.g.children[0].position.y = Math.sin(time * 0.8 + i) * 0.06 * speed; });
  if (laptopObj && laptopObj.userData.screen) laptopObj.userData.screen.material.emissiveIntensity = 0.85 + 0.15 * Math.sin(time * 2);
  botObjs.forEach(b => {
    const w = b.userData.walk;
    if (w) {
      w.ang += dt * w.speed * speed;
      b.position.set(Math.cos(w.ang) * w.rad, 0.03 + b.parent.children[0].position.y, Math.sin(w.ang) * w.rad);
      b.rotation.y = -w.ang + (w.speed > 0 ? Math.PI : 0);
      b.userData.legs.forEach((leg, k) => { leg.rotation.x = Math.sin(time * 9 + (k % 2 ? 0 : Math.PI)) * 0.5 * speed; });
    } else if (b.userData.info && b.userData.info.sleeping) {
      b.position.y = 0.03 + b.parent.children[0].position.y; b.userData.inner.scale.y = 1 + Math.sin(time * 1.5) * 0.03;
    }
    if (b.userData.flame) b.userData.flame.scale.y = 0.8 + Math.random() * 0.5;
  });
  movers.forEach(m => placeMover(m, time * speed));
  // selected bot bounce + speech bubble
  if (selected && selected.bot) {
    const b = selected.bot; if (b.userData.inner) b.userData.inner.position.y = Math.abs(Math.sin(time * 5)) * 0.12;
    b.getWorldPosition(tmpV); tmpN.copy(tmpV).normalize(); camDir.copy(camera.position).normalize();
    const facing = tmpN.dot(camDir) > 0.1 && b.visible !== false;
    const sp = tmpV.clone().add(tmpN.multiplyScalar(0.55)).project(camera);
    bubble.hidden = !facing || sp.z > 1 || window.innerWidth <= 640;   // phones: the card already shows the quote bubble.style.left = ((sp.x + 1) / 2 * window.innerWidth) + "px"; bubble.style.top = ((1 - sp.y) / 2 * window.innerHeight) + "px";
  }
  botObjs.forEach(b => { if ((!selected || selected.bot !== b) && b.userData.inner) b.userData.inner.position.y = 0; });
  // labels
  camDir.copy(camera.position).normalize(); const dist = camera.position.length();
  const compact = !focus && dist > 22;
  if (compact !== document.body.classList.contains("compact")) { document.body.classList.toggle("compact", compact); labels.forEach(lb => { lb.w = 0; }); }
  const blocked = [headerEl, navChips, aboutEl].concat(cardEl.hidden ? [] : [cardEl]).map(el => el.getBoundingClientRect());
  const placed = [];
  const hits = (a, b) => a.x < b.right && a.x + a.w > b.left && a.y < b.bottom && a.y + a.h > b.top;
  labels.forEach(lb => {
    const p = lb.anchor.clone().project(camera), facing = lb.normal.dot(camera.position.clone().sub(lb.anchor).normalize());
    let show = facing > (lb.minor ? 0.35 : 0.12) && p.z < 1 && (!lb.minor || dist < 26 || focus);
    let x = (p.x + 1) / 2 * window.innerWidth, y = (1 - p.y) / 2 * window.innerHeight;
    if (show) {
      if (!lb.w) { lb.w = lb.el.offsetWidth; lb.h = lb.el.offsetHeight; }
      // try the spot above the island, then nudged left, right or higher; hide only if all collide
      x = Math.min(Math.max(x, lb.w / 2 + 8), window.innerWidth - lb.w / 2 - 8);   // keep labels on screen
      const tries = [[0, 0], [-(lb.w / 2 + 10), 0], [lb.w / 2 + 10, 0], [0, -(lb.h + 8)]];
      let ok = false;
      for (const [dx, dy] of tries) {
        const r = { x: x + dx - lb.w / 2 - 4, y: y + dy - lb.h - 4, w: lb.w + 8, h: lb.h + 8 };
        if (!blocked.some(b => hits(r, b)) && !placed.some(b => hits(r, b))) { placed.push({ left: r.x, right: r.x + r.w, top: r.y, bottom: r.y + r.h }); x += dx; y += dy; ok = true; break; }
      }
      show = ok;
    }
    lb.el.style.opacity = show ? "1" : "0"; lb.el.style.pointerEvents = show && !lb.minor ? "auto" : "none";
    lb.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
  });
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
document.getElementById("loading").remove();
if (!polys) { const h = document.getElementById("hint"); h.textContent = "Coastlines didn't load, so the globe shows only sea. Reload to try again."; }
tick();
})();
