<style>
/* Layout: the theatre (one character's journey playing as a relay, with its profile beside it) on top, the whole crew
   lined up below in groups. One dark look on purpose: it matches the night-sky Data World this page belongs to. */
:root {
  color-scheme: dark;
  --sky: #0a0f1a;
  --panel: #131b2b;
  --panel-2: #1a2438;
  --line: #27334d;
  --ink: #f2ece4;
  --ink-2: #a9b2c4;
  --amber: #ffc21a;     /* the data baton */
  --orange: #e8875c;    /* the bots */
  --cyan: #4fd8ff;      /* messages */
  --green: #7dff6a;     /* money */
  --font-display: "Fredoka", "Avenir Next Rounded", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 34px; }
header { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between; }
header > div { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 4.6vw, 44px); line-height: 1.05; margin: 0 0 6px; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 60ch; }
.toplink { color: var(--ink); text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 15px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.toplink:hover { border-color: var(--orange); }

.theater { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stage { border-radius: 16px; border: 1px solid var(--line); overflow: hidden; background: var(--panel); display: grid; }
.stage-view { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(180deg, #1c2a46 0%, #2c3c60 55%, #22304a 100%); }
.stage-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.slabel { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; font-family: var(--font-display); font-weight: 600;
  font-size: 13px; padding: 3px 8px; border-radius: 8px; background: rgba(10, 15, 26, 0.78); border: 1px solid var(--line); }
.caption { display: grid; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--line); min-height: 92px; align-content: start; }
.caption p { margin: 0; font-size: 15px; }
.caption .meta { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--amber); }
.dots i.done { background: #8a6d1d; }
.replay { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.replay:hover { border-color: var(--amber); }

.profile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; display: grid; gap: 12px; }
.profile .who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.profile h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 0; line-height: 1.1; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); }
.role { color: var(--ink-2); font-size: 13.5px; margin: -6px 0 0; }
.says { margin: 0; padding: 10px 12px; border-radius: 12px; background: rgba(232, 135, 92, 0.14); font-size: 14.5px; }
.profile dl { margin: 0; display: grid; gap: 10px; }
.profile dt { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.profile dd { margin: 2px 0 0; font-size: 14.5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.links button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.links button:hover { border-color: var(--orange); }
.links .arrow { color: var(--ink-2); font-size: 12px; align-self: center; }

.group h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0 0 2px; }
.group p { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.card { font: inherit; color: var(--ink); text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 0 8px; cursor: pointer; display: grid; overflow: hidden; }
.card:hover { border-color: var(--orange); }
.card[aria-pressed="true"] { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.card:focus-visible, .links button:focus-visible, .replay:focus-visible, .toplink:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.card .view { aspect-ratio: 1 / 1; width: 100%; background: radial-gradient(circle at 50% 70%, #24314d, #141c2c 70%); }
.card b { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin-top: 4px; }
.card small { color: var(--ink-2); font-size: 11.5px; padding: 0 6px; line-height: 1.3; }
#groups { display: grid; gap: 30px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.loading { color: var(--ink-2); font-size: 13px; }
@media (max-width: 860px) { .theater { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .caption p { font-size: 14px; } .stage-view { aspect-ratio: 4 / 3; } }
</style>

const ASSETS = "assets/", MODEL_EXT = ".glb";        // the claude.ai preview serves the same models as embedded glTF JSON

  // preview: rebuild the binary model in memory from the glTF JSON (no extra network requests, so it works inside claude.ai)
  const gj = await (await fetch(ASSETS + file.replace(/\.glb$/, MODEL_EXT))).json();
  const b64 = gj.buffers[0].uri.split(",")[1], bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  delete gj.buffers[0].uri;
  const enc = new TextEncoder(), pad = n => (4 - n % 4) % 4;
  let js = enc.encode(JSON.stringify(gj)); js = Uint8Array.from([...js, ...new Array(pad(js.length)).fill(0x20)]);
  const binP = Uint8Array.from([...bin, ...new Array(pad(bin.length)).fill(0)]);
  const total = 12 + 8 + js.length + 8 + binP.length, out = new ArrayBuffer(total), dv = new DataView(out), u8 = new Uint8Array(out);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
  dv.setUint32(12, js.length, true); dv.setUint32(16, 0x4E4F534A, true); u8.set(js, 20);
  const o = 20 + js.length; dv.setUint32(o, binP.length, true); dv.setUint32(o + 4, 0x004E4942, true); u8.set(binP, o + 8);
  return loader.parseAsync(out, "");
}
function loadGLB(file) { return cache[file] || (cache[file] = fetchModel(file)); }
async function instance(file) {
  const g = await loadGLB(file), root = g.scene.clone(true), mixer = new THREE.AnimationMixer(root), actions = {};
  g.animations.forEach(a => { actions[a.name] = mixer.clipAction(a); });
  return { root, mixer, actions, play(name) { Object.entries(actions).forEach(([n, a]) => { if (n === name) a.reset().play(); else a.stop(); }); } };
}
function lights(scene) {
  scene.add(new THREE.HemisphereLight(0xfff1e2, 0x2a3350, 1.3));
  const d = new THREE.DirectionalLight(0xffffff, 1.8); d.position.set(3, 6, 5); scene.add(d);
}

/* ---------------------------------------------------------------- one renderer, many views (each card and the stage draw into their own rectangle) */
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const views = [];
function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); }
window.addEventListener("resize", resize); resize();

/* roster cards */
const groupsEl = document.getElementById("groups");
GROUPS.forEach(([title, note, ids]) => {
  const sec = document.createElement("section"); sec.className = "group";
  sec.innerHTML = `<h2>${title}</h2><p>${note}</p><div class="grid"></div>`;
  const grid = sec.querySelector(".grid");
  ids.forEach(id => {
    const c = charInfo(id), btn = document.createElement("button");
    btn.type = "button"; btn.className = "card"; btn.dataset.id = id; btn.setAttribute("aria-pressed", "false");
    btn.innerHTML = `<div class="view"></div><b>${c.name}</b><small>${c.chip || ""}</small>`;
    btn.addEventListener("click", () => select(id, true));
    grid.appendChild(btn);
    const scene = new THREE.Scene(); lights(scene);
    const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
    const v = { el: btn.querySelector(".view"), scene, cam, mixers: [] }; views.push(v);
    instance(c.file).then(m => {
      const box = new THREE.Box3().setFromObject(m.root), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
      m.root.position.sub(center); m.root.position.y += size.y / 2 - size.y * 0.05;
      if (EXTRA[id] && ["tanker", "container", "sub"].includes(id)) m.root.rotation.y = -0.9; else m.root.rotation.y = 0.45;
      scene.add(m.root);
      const r = Math.max(size.x, size.y, size.z);
      cam.position.set(r * 0.6, r * 0.8, r * 2.15); cam.lookAt(0, size.y * 0.48, 0);
      m.play(id === "ml" ? "hammer" : id === "me" ? "wave" : "idle"); v.mixers.push(m.mixer);
    }).catch(() => {});
  });
  groupsEl.appendChild(sec);
});

/* ---------------------------------------------------------------- the stage: a relay track built for the selected character */
const stageEl = document.getElementById("stageView"), labelsEl = document.getElementById("slabels"), capEl = document.getElementById("cap"), dotsEl = document.getElementById("dots");
const stage = { el: stageEl, scene: null, cam: new THREE.PerspectiveCamera(36, 1.6, 0.05, 400), mixers: [], focus: new THREE.Vector3(), play: null };
views.push(stage);
const SCALE = { tanker: 0.5, container: 0.5, sub: 0.55, rupee: 1.0, laptop: 1.5, ml: 0.85, me: 2.1 };
const CRATE_Y = { tanker: 1.2, container: 1.9, sub: 1.3, rupee: null };
let build = 0;
async function buildStage(id) {
  const my = ++build, j = JOURNEYS[id];
  const scene = new THREE.Scene(); lights(scene); scene.fog = new THREE.Fog(0x22304d, 30, 80);
  const mixers = []; labelsEl.innerHTML = "";
  // stops along the track
  const stops = [{ name: j.start, x: 0 }];
  j.legs.forEach(l => { if (l.to) stops.push({ name: l.to, x: stops[stops.length - 1].x + (l.sea ? 12 : 7.5), sea: !!l.sea }); });
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x5b6b3e, roughness: 0.95 }), seaMat = new THREE.MeshStandardMaterial({ color: 0x1f6f9a, roughness: 0.5, emissive: 0x0b2a40 });
  const extent = stops[stops.length - 1].x;
  const land0 = new THREE.Mesh(new THREE.BoxGeometry(10, 0.3, 5), floorMat); land0.position.set(-3, -0.15, 0); scene.add(land0);
  for (let i = 1; i < stops.length; i++) {
    const a = stops[i - 1].x, b = stops[i].x, len = b - a;
    const seg = new THREE.Mesh(new THREE.BoxGeometry(len, stops[i].sea ? 0.2 : 0.3, 5), stops[i].sea ? seaMat : floorMat);
    seg.position.set(a + len / 2, stops[i].sea ? -0.3 : -0.15, 0); scene.add(seg);
  }
  const landEnd = new THREE.Mesh(new THREE.BoxGeometry(10, 0.3, 5), floorMat); landEnd.position.set(extent + 3, -0.15, 0); scene.add(landEnd);
  // a glowing path line along the track
  const path = new THREE.Mesh(new THREE.BoxGeometry(extent + 2, 0.02, 0.12), new THREE.MeshBasicMaterial({ color: j.money ? 0x7dff6a : 0xffc21a }));
  path.position.set(extent / 2, 0.03, 1.2); scene.add(path);
  // signposts + labels
  stops.forEach(s => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 6), new THREE.MeshStandardMaterial({ color: 0xd8cfc0 })); post.position.set(s.x, 0.8, -1.6); scene.add(post);
    const sign = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.06), new THREE.MeshStandardMaterial({ color: 0xe8875c })); sign.position.set(s.x, 1.55, -1.6); scene.add(sign);
    const el = document.createElement("div"); el.className = "slabel"; el.textContent = s.name; labelsEl.appendChild(el); s.el = el;
  });
  // props at home stops
  const props = {};
  const laptopStop = stops.find(s => s.name === L), phoneStop = stops.find(s => s.name === PHONE);
  const needLaptop = laptopStop || j.legs.some(l => l.work === "laptop" || l.work === "ml");
  const lapX = laptopStop ? laptopStop.x : 0;
  if (needLaptop) {
    const lap = await instance(EXTRA.laptop.file); lap.root.scale.setScalar(SCALE.laptop); lap.root.position.set(lapX, 0, -0.9); lap.play("idle"); scene.add(lap.root); mixers.push(lap.mixer); props.laptop = lap;
    props.ml = [];
    for (let k = 0; k < 3; k++) { const m = await instance(EXTRA.ml.file); m.root.scale.setScalar(SCALE.ml); m.root.position.set(lapX - 2.1 + k * 0.9 + (k === 2 ? 2.4 : 0), 0, 0.2 - (k % 2) * 0.5); m.root.rotation.y = k === 2 ? -0.6 : 0.6; m.play("idle"); scene.add(m.root); mixers.push(m.mixer); props.ml.push(m); }
  }
  const needMe = phoneStop || j.legs.some(l => l.work === "me") || ["You", "Back to you"].some(n => stops.find(s => s.name === n));
  if (needMe) {
    const meStop = phoneStop || stops.find(s => s.name === "You") || stops[0];
    const me = await instance(EXTRA.me.file); me.root.scale.setScalar(SCALE.me); me.root.position.set(meStop.x + 0.6, 0, -1.4); me.root.rotation.y = -0.3; me.play("idle"); scene.add(me.root); mixers.push(me.mixer); props.me = me;
    if (phoneStop) { const ph = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.9, 0.08), new THREE.MeshStandardMaterial({ color: 0x1b1b22 }));
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.78), new THREE.MeshBasicMaterial({ color: 0x4fd8ff })); scr.position.z = 0.045; ph.add(body, scr); ph.position.set(phoneStop.x - 0.9, 0.75, 0.3); ph.rotation.y = 0.3; scene.add(ph); }
  }
  if (my !== build) return;
  // carriers wait at the stop where their leg begins
  const legs = [], byWho = {};

  for (const l of j.legs) {
    const leg = Object.assign({}, l);
    if (l.to) {
      const from = stops[stopIdx], to = stops[stopIdx + 1]; stopIdx++;
      leg.from = from.x; leg.toX = to.x;
      const key = l.who === "courier" ? "courier" : l.who;
      if (!byWho[key + "@" + from.x]) {
        const file = l.who === "courier" ? "bots/bot_IN.glb" : (EXTRA[l.who] ? EXTRA[l.who].file : `bots/bot_${flagOf(l.who)}.glb`);
        const m = await instance(file); const s = SCALE[l.who] || 1;
        m.root.scale.setScalar(s); m.root.rotation.y = Math.PI / 2; m.root.position.set(from.x, l.sea ? -0.15 : 0, l.sea ? 0.2 : 0.6);
        m.play("idle"); scene.add(m.root); mixers.push(m.mixer); byWho[key + "@" + from.x] = m;
        // a carrier that keeps going (same who, next leg) reuses this instance
      }
      leg.m = byWho[key + "@" + from.x]; byWho[key + "@" + to.x] = leg.m;
      leg.sea = !!l.sea; leg.dur = l.sea ? 3.2 : 2.2;

  if (!j.legs.some(l => l.who === id) && !["laptop", "ml", "me", "rupee"].includes(id)) {
    const c = charInfo(id), m = await instance(c.file); m.root.scale.setScalar(SCALE[id] || 1); m.root.rotation.y = 0.5;
    m.root.position.set(stops[0].x - 1.4, 0, 0.9); m.play("idle"); scene.add(m.root); mixers.push(m.mixer);
  }
  if (my !== build) return;
  // the baton
  let crate = null;
  if (!j.money) { crate = await instance("props/data_crate.glb"); crate.root.scale.setScalar(0.75); crate.play("idle"); scene.add(crate.root); mixers.push(crate.mixer); }
  if (my !== build) return;
  stage.scene = scene; stage.mixers = mixers; stage.stops = stops; stage.legs = legs; stage.crate = crate; stage.props = props; stage.id = id;
  dotsEl.innerHTML = legs.map(() => "<i></i>").join("");
  startPlay();
}
function startPlay() {
  const s = stage; s.t = 0; s.leg = -1; s.done = false;
  s.legs.forEach(l => { if (l.m) { l.m.root.position.x = l.from; l.m.play("idle"); } });
  s.focus.set(s.stops[0].x, 0, 0);
}
function crateOn(m, who) {
  const y = CRATE_Y[who] !== undefined ? CRATE_Y[who] : 1.25;
  return new THREE.Vector3(m.root.position.x, y === null ? -99 : y, m.root.position.z);
}
function stepStage(dt) {
  const s = stage; if (!s.scene || s.done) return;
  s.t += dt;
  let acc = 0, i = 0; while (i < s.legs.length && s.t > acc + s.legs[i].dur + 0.5) { acc += s.legs[i].dur + 0.5; i++; }
  if (i >= s.legs.length) { s.done = true; capEl.textContent = "That's the whole journey. Tap another character, or watch again."; setDots(s.legs.length); return; }
  const leg = s.legs[i], local = Math.min(1, Math.max(0, (s.t - acc) / leg.dur));
  if (i !== s.leg) {                                    // a new leg starts: caption, animations, the previous carrier rests
    if (s.leg >= 0 && s.legs[s.leg].m) s.legs[s.leg].m.play("idle");
    s.leg = i; capEl.textContent = leg.text; setDots(i);
    if (leg.m) leg.m.play(leg.sea ? "idle" : "run");
    if (leg.work === "me" && s.props.me) s.props.me.play("wave");
    if (leg.work === "ml" && s.props.ml) s.props.ml.forEach(m => m.play("hammer"));
  }
  if (leg.m) {
    const e = local < 0.5 ? 2 * local * local : 1 - Math.pow(-2 * local + 2, 2) / 2;
    leg.m.root.position.x = leg.from + (leg.toX - leg.from) * e;
    if (leg.sea) leg.m.root.position.y = -0.15 + Math.sin(s.t * 3) * 0.05;
    s.focus.x += (leg.m.root.position.x - s.focus.x) * Math.min(1, dt * 4);
    if (s.crate) s.crate.root.position.copy(crateOn(leg.m, leg.who));
  } else {
    const x = leg.at;
    s.focus.x += (x - s.focus.x) * Math.min(1, dt * 4);
    if (s.crate) {
      let target;
      if (leg.work === "laptop" && s.props.laptop) target = new THREE.Vector3(x, 1.9 - local * 1.2, -0.9);
      else if (leg.work === "ml" && s.props.ml) target = new THREE.Vector3(x - 1.2, 1.6 + Math.sin(s.t * 6) * 0.15, -0.1);
      else if (leg.work === "me" && s.props.me) target = new THREE.Vector3(s.props.me.root.position.x, 3.6 + Math.sin(s.t * 3) * 0.1, -1.2);

function setDots(i) { [...dotsEl.children].forEach((d, k) => { d.className = k < i ? "done" : k === i ? "on" : ""; }); }
document.getElementById("replay").addEventListener("click", () => { if (stage.scene) startPlay(); });

/* ---------------------------------------------------------------- profile + selection */
const profileEl = document.getElementById("profile");
function chips(ids) { return ids.map(x => `<button type="button" data-go="${x}">${charInfo(x).name}</button>`).join(""); }
function select(id, scrollUp) {
  document.querySelectorAll(".card").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.id === id)));
  const c = charInfo(id), par = parallelOf(id), baton = batonIds(id);
  profileEl.innerHTML = `<div class="who"><h2>${c.name}</h2>${c.chip ? `<span class="chip">${c.chip}</span>` : ""}</div>
    <p class="role">${c.role}</p><p class="says">“${c.says}”</p>
    <dl><div><dt>What I bring</dt><dd>${c.brings || "—"}</dd></div><div><dt>Where I get it</dt><dd>${c.from || "—"}</dd></div>
    <div><dt>What it means</dt><dd>${c.means || "—"}</dd></div><div><dt>When</dt><dd>${c.when || "—"}</dd></div>
    ${baton.length ? `<div><dt>Passes the baton to</dt><dd class="links">${baton.map((b, k) => (k ? '<span class="arrow">→</span>' : "") + `<button type="button" data-go="${b}">${charInfo(b).name}</button>`).join("")}</dd></div>` : ""}
    ${par.ids.length ? `<div><dt>Running at the same time</dt><dd>${par.text}<div class="links">${chips(par.ids)}</div></dd></div>` : ""}</dl>`;
  profileEl.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go, true)));
  capEl.textContent = `Setting up ${c.name}'s journey…`;
  buildStage(id);
  if (scrollUp) stageEl.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

/* ---------------------------------------------------------------- loop */
const clock = new THREE.Clock(), tmp = new THREE.Vector3();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  views.forEach(v => v.mixers.forEach(m => m.update(dt)));
  stepStage(dt);
  renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);
  const H = window.innerHeight;
  for (const v of views) {
    if (!v.scene) continue;
    const r = v.el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > H || r.width < 2) continue;
    const y = H - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height); renderer.setScissor(r.left, y, r.width, r.height);
    v.cam.aspect = r.width / r.height; v.cam.updateProjectionMatrix();
    if (v === stage) {
      const fx = stage.focus.x, phone = window.innerWidth < 640;
      v.cam.position.set(fx + 1.2, phone ? 5.2 : 4.4, phone ? 13 : 10.5); v.cam.lookAt(fx + 1.2, 0.9, 0);
      stage.stops && stage.stops.forEach(s => {          // signpost labels follow the camera
        tmp.set(s.x, 2.05, -1.6).project(v.cam);
        const inView = tmp.z < 1 && tmp.x > -1.1 && tmp.x < 1.1;
        s.el.style.display = inView ? "" : "none";
        s.el.style.transform = `translate(${(tmp.x + 1) / 2 * r.width}px, ${(1 - tmp.y) / 2 * r.height}px) translate(-50%, -100%)`;
      });
    }
    renderer.render(v.scene, v.cam);
  }
  requestAnimationFrame(frame);
}
frame();
const ALL = new Set(GROUPS.flatMap(g => g[2]));
const first = location.hash.slice(1);                 // /crew.html#fed opens Fed's journey
select(ALL.has(first) ? first : "fed", false);
</script>
