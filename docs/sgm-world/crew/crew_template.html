<style>
/* Layout: the journey stage is the hero with a short character card beside it; under it a slim strip of tiny characters;
   the whole crew opens in a liquid-glass sheet. One dark look on purpose: it matches the night-sky Data World. */
:root {
  color-scheme: dark;
  --sky: #0a0f1a;
  --panel: #131b2b;
  --panel-2: #1a2438;
  --line: #27334d;
  --ink: #f2ece4;
  --ink-2: #a9b2c4;
  --amber: #ffc21a;     /* data */
  --orange: #e8875c;    /* the bots */
  --cyan: #4fd8ff;      /* messages */
  --green: #7dff6a;     /* money */
  --font-display: "Fredoka", "Avenir Next Rounded", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(120% 80% at 50% 0%, #142038 0%, var(--sky) 60%); background-color: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; min-height: 100%; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
header > div { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.05; margin: 0 0 4px; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 64ch; }
.toplink { color: var(--ink); text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.toplink:hover { border-color: var(--orange); }

.theater { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.stage { border-radius: 18px; border: 1px solid var(--line); overflow: hidden; background: var(--panel); display: grid; min-width: 0; }
.stage-view { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(180deg, #2a3f6a 0%, #3d5a86 46%, #5c7aa3 60%, #2b3c5c 100%); }
.stage-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 13; }   /* above the 3D canvas */
.slabel { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--font-display); font-weight: 600; font-size: 12.5px; padding: 3px 9px; border-radius: 9px;
  color: var(--ink); background: rgba(10, 15, 26, 0.72); border: 1px solid rgba(255,255,255,0.16); transition: border-color .3s; }
.slabel.passed { border-color: rgba(125,255,106,.7); }
.caption { display: grid; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--line); min-height: 84px; align-content: start; }
.caption p { margin: 0; font-size: 15px; }
.caption .meta { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--amber); box-shadow: 0 0 0 3px rgba(255,194,26,.18); }
.dots i.done { background: #8a6d1d; }
.btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.btn:hover { border-color: var(--amber); }

.profile { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.profile .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.profile h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; line-height: 1.1; }
.chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); }
.role { color: var(--ink-2); font-size: 13px; margin: -6px 0 0; }
.says { margin: 0; padding: 9px 11px; border-radius: 12px; background: rgba(232, 135, 92, 0.14); font-size: 14px; }
.profile dl { margin: 0; display: grid; gap: 8px; }
.profile dt { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.profile dd { margin: 2px 0 0; font-size: 13.5px; }
.links { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; align-items: center; }
.links button { font: inherit; font-size: 12.5px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.links button:hover { border-color: var(--orange); }
.links .arrow { color: var(--ink-2); font-size: 11px; }
.profile details summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.profile details dl { margin-top: 8px; }

/* the slim crew strip */
.strip { display: grid; gap: 8px; min-width: 0; }
.strip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.strip-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
.strip-head h2 button { all: unset; cursor: pointer; }
.strip-head h2 button:hover { color: var(--amber); }
.strip-head span { color: var(--ink-2); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.strip-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scroll-snap-type: x proximity; }
.mini { flex: 0 0 auto; width: 70px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 0 5px; cursor: pointer; display: grid; justify-items: center; scroll-snap-align: start; }
.mini:hover { border-color: var(--orange); }
.mini[aria-pressed="true"] { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.mini .view { width: 100%; aspect-ratio: 1 / 1; }
.mini b { font-size: 11px; font-weight: 600; line-height: 1.1; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* liquid-glass sheet with the whole crew */
.backdrop { position: fixed; inset: 0; z-index: 10; background: rgba(4, 7, 13, 0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.sheet { position: fixed; z-index: 11; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(820px, calc(100% - 32px)); max-height: min(84vh, 860px);
  display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; border-radius: 30px;
  background: linear-gradient(140deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.06) 38%, rgba(160,190,255,0.08) 100%);
  backdrop-filter: blur(30px) saturate(185%); -webkit-backdrop-filter: blur(30px) saturate(185%);
  border: 1px solid rgba(255,255,255,0.24);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1px 0 rgba(255,255,255,0.08), inset 0 0 40px rgba(255,255,255,0.05), 0 40px 90px rgba(0,0,0,0.5); }
.sheet::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 60% at 20% -10%, rgba(255,255,255,0.22), transparent 55%); }
.sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 10px; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; }
.sheet-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: var(--ink); font-size: 18px; cursor: pointer; flex: none; }
.sheet-body { position: relative; overflow-y: auto; padding: 4px 22px 22px; display: grid; gap: 16px; align-content: start; }
.sgroup h3 { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .02em; margin: 0 0 6px; color: var(--ink-2); }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.row { font: inherit; color: var(--ink); text-align: left; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 14px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); cursor: pointer; }
.row:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); }
.row .view { width: 40px; height: 40px; border-radius: 10px; background: rgba(0,0,0,0.18); }
.row b { font-family: var(--font-display); font-weight: 600; font-size: 14px; display: block; line-height: 1.15; }
.row b small { font-family: var(--font-body); font-weight: 500; color: var(--ink-2); }
.row span { font-size: 12px; color: var(--ink-2); line-height: 1.3; display: block; }
.mini:focus-visible, .row:focus-visible, .links button:focus-visible, .btn:focus-visible, .toplink:focus-visible, .close:focus-visible, #openAll:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 12; }
@media (max-width: 900px) { .theater { display: contents; } .stage { order: 1; } .strip { order: 2; } .profile { order: 3; } }   /* phones: stage, then the crew strip, then the card */
@media (max-width: 560px) {
  .stage-view { aspect-ratio: 4 / 3; } .caption p { font-size: 14px; }
  .sheet { left: 0; right: 0; bottom: 0; top: auto; transform: none; width: 100%; max-height: 86vh; border-radius: 28px 28px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet-head, .sheet-body { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { .slabel { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>The SGM crew</h1>
      <p class="lede">Pick a character and watch its whole journey: where it starts, who it throws the crate to, and where it ends up.</p>
    </div>
    <a class="toplink" id="worldLink" href="/">Back to the Data World</a>
  </header>

  <section class="theater" aria-label="Journey">
    <div class="stage">
      <div class="stage-view" id="stageView"><div class="stage-labels" id="slabels"></div></div>
      <div class="caption"><p id="cap">Loading the crew…</p><div class="meta"><div class="dots" id="dots"></div><button class="btn" id="replay" type="button">Watch again</button></div></div>
    </div>
    <aside class="profile" id="profile" aria-live="polite"><p class="role">Loading…</p></aside>
  </section>

  <section class="strip" aria-label="The crew">
    <div class="strip-head">
      <h2><button type="button" id="openAll">Meet the crew →</button></h2>
      <span>Tap anyone to watch their journey <button class="btn" type="button" id="openAll2">What does everyone do?</button></span>
    </div>
    <div class="strip-list" id="strip"></div>
  </section>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><div><h2 id="sheetTitle">The whole crew</h2><p>What each one brings, in one line. Tap one to watch its journey.</p></div><button class="close" id="closeSheet" type="button" aria-label="Close">×</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<canvas id="gl" aria-hidden="true"></canvas>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const D = window.SGM_DATA, BOT = Object.fromEntries(D.BOTS.map(b => [b.id, b]));
const COUNTRY = { IN: "India", US: "USA", DE: "Germany", AE: "UAE" };
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (location.protocol.startsWith("http") && !location.hostname.endsWith("vercel.app") && location.hostname !== "localhost") document.getElementById("worldLink").hidden = true;

/* ================================================================ the characters (bot text comes from world/data.js) */
const flagOf = id => D.FLAG[BOT[id].st];
const EXTRA = {   // characters that aren't data bots
  tanker: { name: "Ship 1", file: "props/tanker_oil.glb", chip: "Oil tanker", role: "Carries world prices from the US East Coast to Mumbai",
    says: "I carry Fed's crate of oil and world prices across the Atlantic and the Red Sea to Mumbai.", brings: "Fed's crate: oil, metal and crop prices, the dollar and US rates",
    from: "The US East Coast cable station", means: "In real life this data crosses the sea through undersea fibre cables in a fraction of a second. The tanker is the cartoon of that, and a reminder that India's oil itself arrives by ship.", when: "During every 6:45 PM run" },
  container: { name: "Ship 2", file: "props/container_ship.glb", chip: "Container ship", role: "Carries data from California across the Pacific to Chennai",
    says: "I bring Claude's Friday note and the world's headlines across the Pacific to Chennai.", brings: "Claude's Friday note and Gnews's world headlines", from: "The San Francisco coast",
    means: "Real route: undersea cables across the Pacific and through Singapore, simplified here.", when: "During the runs; Fridays for Claude's note" },
  sub: { name: "Submarine", file: "props/submarine.glb", chip: "Undersea cable", role: "Marks the undersea cable from Marseille to Mumbai",
    says: "I carry Euro's exchange rates under the sea from Marseille to Mumbai.", brings: "Euro's crate: daily exchange rates", from: "Marseille, where Europe's cables meet the sea",
    means: "Most of India's internet arrives through cables on the sea floor that land in Mumbai and Chennai.", when: "During every 6:45 PM run" },
  laptop: { name: "Your laptop", file: "props/laptop_giant.glb", chip: "Bengaluru", role: "Where every crate ends up",
    says: "Every weekday at 6:45 PM all the crates arrive here and I check them. On Fridays at 7:30 PM I hand them to the ML bots.", brings: "Every crate from every bot",
    from: "All the bots, through Bengaluru", means: "21 data checks run after every daily run. If a check fails, the list is held back and you get a failure message instead.", when: "Weekdays 6:45 PM; Fridays 7:30 PM" },
  ml: { name: "ML bots", file: "props/bot_ML.glb", chip: "Inside the laptop", role: "Hammer the data into the Friday list",
    says: "We hammer the data into model scores, find the hot industries and run the V3.2 rule.", brings: "The Friday buy list",
    from: "Your laptop", means: "Three models score every stock. The V3.2 rule keeps hot industries, ₹1 cr a day of trading, the trend test and the top 9, then drops financials, fading-theme names and trade-for-trade names.", when: "Fridays 7:30 PM" },
  me: { name: "You", file: "props/me_figure.glb", chip: "The boss", role: "Decides and places the order",
    says: "I read the Friday list, sign the Saturday review and place the Monday order before the market opens.", brings: "The decision", from: "Your phone",
    means: "Nothing is bought without you. Each weekly batch is held for about 6 months, then sold, and the money rolls into that week's new batch.", when: "Friday evening, Saturday, Monday morning" },
  rupee: { name: "₹ note", file: "props/rupee_note.glb", chip: "Money", role: "Your money's round trip",
    says: "I go from your SBI account into a weekly batch of stocks, sit there for about 6 months, and come back to roll into the next batch.", brings: "Your money (no amounts shown here)",
    from: "Your SBI account", means: "Money moves only when you place the order. A batch is sold after 126 trading days, about 6 months.", when: "Mondays at the market open" }
};
function charInfo(id) {
  if (EXTRA[id]) return Object.assign({ id }, EXTRA[id]);
  const b = BOT[id], LM = D.LAYMAN[id] || {}, flag = flagOf(id);
  return { id, name: b.name, file: `bots/bot_${id}.glb`, flag, chip: COUNTRY[flag], role: b.role, says: b.says, brings: LM.brings, from: LM.from, means: LM.means, when: b.when };
}
const GROUPS = [
  ["Data bots · leave together at 6:45 PM", ["bhav", "split", "filer", "promo", "tally", "nsdl", "amfi", "khabri", "khabri2", "sarkari", "screeny", "tikki", "fed", "euro", "gnews", "dalal"]],
  ["Messengers and helpers", ["claude", "pigeon", "clock", "watch", "drive", "paisa"]],
  ["Vehicles", ["tanker", "container", "sub"]],
  ["At home in Bengaluru", ["laptop", "ml", "me", "rupee"]]
];
const ALL = GROUPS.flatMap(g => g[1]);
const PARALLEL = {
  fetch: ["bhav", "split", "filer", "promo", "tally", "nsdl", "amfi", "khabri", "khabri2", "sarkari", "screeny", "tikki", "fed", "euro", "gnews"],
  ships: ["tanker", "container", "sub"], friday: ["claude", "laptop", "ml", "pigeon", "clock"], money: ["paisa", "rupee", "me"], watch: ["clock", "watch", "pigeon"]
};
function parallelOf(id) {
  const g = Object.entries(PARALLEL).find(([, ids]) => ids.includes(id));
  if (!g) return { text: "", ids: [] };
  const text = { fetch: "All the data bots leave at once, every weekday at 6:45 PM.", ships: "The three crossings happen in the same evening run.",
                 friday: "These work together on Fridays.", money: "These move together on Mondays.", watch: "These keep the system running around the clock." }[g[0]];
  return { text, ids: g[1].filter(x => x !== id) };
}

/* ================================================================ journeys. A leg with `to` = the carrier runs or sails to the next stop; `work` = something happens at this stop */
const LAP = "Your laptop, Bengaluru", PHONE = "Your phone";
const tailList = use => [{ work: "laptop", text: "The crate drops into your laptop. 21 data checks tick off one by one." },
  { work: "ml", text: use }, { who: "pigeon", to: PHONE, text: "Friday 7:30 PM: Pigeon carries the buy list to your phone on Telegram." },
  { work: "me", text: "Your phone buzzes. You read the list, sign the Saturday review and place the Monday order." }];
const tailContext = text => [{ work: "laptop", text }];
const J = {
  fed: { start: "St. Louis Fed", legs: [{ who: "fed", to: "US East Coast", text: "Fed picks up oil, metal and crop prices, the dollar and US rates, and runs to the coast." },
    { who: "tanker", to: "Mumbai cable landing", sea: true, text: "Fed throws the crate aboard Ship 1, which carries it across the Atlantic and the Red Sea. In real life: undersea fibre cable, in a fraction of a second." },
    { who: "courier", to: LAP, text: "A courier catches it in Mumbai and runs it to your laptop in Bengaluru." },
    ...tailList("Friday, on the anvil: the ML bots hammer out which commodity themes are rising or fading. Stocks tied only to fading themes are dropped.")] },
  euro: { start: "European Central Bank", legs: [{ who: "euro", to: "Marseille", text: "Euro picks up the day's exchange rates and runs to the Mediterranean coast." },
    { who: "sub", to: "Mumbai cable landing", sea: true, text: "The submarine (the undersea cable) carries them to Mumbai." },
    { who: "courier", to: LAP, text: "A courier runs them to your laptop." }, ...tailContext("Exchange rates are kept as market context for research. They don't pick stocks.")] },
  claude: { start: "Anthropic, San Francisco", legs: [{ who: "claude", to: "San Francisco coast", text: "Friday afternoon: Claude reads world prices, foreign money flows and news, and writes a short note on the market." },
    { who: "container", to: "Chennai cable landing", sea: true, text: "Ship 2 brings the note across the Pacific to Chennai." },
    { who: "courier", to: LAP, text: "A courier runs it to your laptop." }, ...tailContext("The note is saved with the week's reports, ready before the 7:30 PM list.")] },
  gnews: { start: "Google News, California", legs: [{ who: "gnews", to: "San Francisco coast", text: "Gnews gathers the world's headlines." },
    { who: "container", to: "Chennai cable landing", sea: true, text: "Ship 2 brings them across the Pacific to Chennai." },
    { who: "courier", to: LAP, text: "A courier runs them to your laptop." }, ...tailContext("A world mood score, kept as background. It doesn't pick stocks.")] },
  bhav: { start: "NSE, Bandra Kurla Complex", legs: [{ who: "bhav", to: LAP, text: "Bhav grabs today's price of every NSE stock and runs it to your laptop." },
    ...tailList("Friday, on the anvil: prices are hammered into the trend test, the ₹1 cr-a-day bar and the model's scores. The top 9 in hot industries make the list.")] },
  split: { start: "NSE, Bandra Kurla Complex", legs: [{ who: "split", to: LAP, text: "Splitty brings the day's splits, bonuses and dividends." },
    { work: "laptop", text: "Old prices are adjusted, so a 1:10 split never looks like a 90% crash." },
    ...tailList("Friday, on the anvil: the clean prices are hammered into the trend test and the model.").slice(1)] },
  filer: { start: "NSE, Bandra Kurla Complex", legs: [{ who: "filer", to: LAP, text: "Filer reads what companies filed today: order wins, results, letters of intent." },
    ...tailList("Friday, on the anvil: filings show which themes each company is tied to. Stocks tied only to fading themes are dropped. Big orders also go in your daily note.")] },
  promo: { start: "NSE, Bandra Kurla Complex", legs: [{ who: "promo", to: LAP, text: "Promo notes which owners bought their own shares and who pledged them." },
    { work: "laptop", text: "Kept for research. Pledge alerts go in your daily note." },
    { who: "pigeon", to: PHONE, text: "Pigeon carries the 6:45 PM daily note to your phone." }, { work: "me", text: "Your phone buzzes with the daily note." }] },
  tally: { start: "NSE, Bandra Kurla Complex", legs: [{ who: "tally", to: LAP, text: "Tally counts today's buying and selling, the big deals, India VIX and the market holidays." },
    { work: "laptop", text: "Market context. The holiday list decides your buy and sell days." },
    { who: "pigeon", to: PHONE, text: "Pigeon carries the daily note, with the right dates, to your phone." }, { work: "me", text: "Your phone buzzes." }] },
  nsdl: { start: "NSDL, Mumbai", legs: [{ who: "nsdl", to: LAP, text: "Videshi tracks foreign money going into or out of Indian shares." },
    ...tailContext("Kept as market context. Claude reads these flows for the Friday market note.")] },
  amfi: { start: "AMFI, Mumbai", legs: [{ who: "amfi", to: LAP, text: "Mutu reads how much money Indian mutual funds manage." }, ...tailContext("Kept as market context. It doesn't pick stocks.")] },
  khabri: { start: "News desks, Mumbai", legs: [{ who: "khabri", to: LAP, text: "Khabri skims Economic Times and Moneycontrol." }, ...tailContext("A news mood score, background only.")] },
  khabri2: { start: "News desks, New Delhi", legs: [{ who: "khabri2", to: LAP, text: "Khabri Jr brings Business Standard and Mint headlines." }, ...tailContext("A news mood score, background only.")] },
  sarkari: { start: "PIB, next to Parliament", legs: [{ who: "sarkari", to: LAP, text: "Sarkari reads every government press release and runs to your laptop." },
    ...tailList("Friday, on the anvil: the policy score shows which industries the government keeps pushing. A hot industry the government is cooling on is vetoed.")] },

    <p class="role">${c.role}</p><p class="says">“${c.says}”</p>
    <dl><div><dt>What it means</dt><dd>${c.means || "—"}</dd></div>
    ${baton.length ? `<div><dt>Hands the crate to</dt><dd class="links">${baton.map((b, k) => (k ? '<span class="arrow">→</span>' : "") + `<button type="button" data-go="${b}">${charInfo(b).name}</button>`).join("")}</dd></div>` : ""}</dl>
    <details><summary>More: what, where, when, who runs alongside</summary><dl>
      <div><dt>What I bring</dt><dd>${c.brings || "—"}</dd></div><div><dt>Where I get it</dt><dd>${c.from || "—"}</dd></div><div><dt>When</dt><dd>${c.when || "—"}</dd></div>
      ${par.ids.length ? `<div><dt>Running at the same time</dt><dd>${par.text}<div class="links">${par.ids.map(x => `<button type="button" data-go="${x}">${charInfo(x).name}</button>`).join("")}</div></dd></div>` : ""}</dl></details>`;
  profileEl.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go, true)));
  capEl.textContent = `Setting up ${c.name}'s journey…`;
  buildStage(id);
  const mini = stripEl.querySelector(`[data-id="${id}"]`);
  if (mini) stripEl.scrollTo({ left: mini.offsetLeft - stripEl.clientWidth / 2 + mini.offsetWidth / 2, behavior: REDUCED ? "auto" : "smooth" });
  if (scrollUp) stageEl.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "nearest" });
}

/* ================================================================ frame loop */
const clock = new THREE.Clock(), tmp = new THREE.Vector3();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()) * (REDUCED ? 0.5 : 1);
  views.forEach(v => v.mixers.forEach(m => m && m.update(dt)));
  stepStage(dt); updateParts(dt);
  stage.shake = Math.max(0, stage.shake - dt * 0.6);
  renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);
  const W = window.innerWidth, H = window.innerHeight;
  for (const v of views) {
    if (!v.scene || (sheetOpen ? !v.sheet : v.sheet)) continue;   // with the sheet open only its thumbnails draw
    const r = v.el.getBoundingClientRect();
    let L = Math.max(0, r.left), T = Math.max(0, r.top), R = Math.min(W, r.right), B = Math.min(H, r.bottom);
    if (v.clip) { const cr = v.clip.getBoundingClientRect(); L = Math.max(L, cr.left); T = Math.max(T, cr.top); R = Math.min(R, cr.right); B = Math.min(B, cr.bottom); }
    if (R - L < 1 || B - T < 1) continue;
    renderer.setViewport(r.left, H - r.bottom, r.width, r.height); renderer.setScissor(L, H - B, R - L, B - T);
    v.cam.aspect = r.width / r.height; v.cam.updateProjectionMatrix();
    if (v === stage) {
      const phone = W < 640, z = (phone ? 14 : 11) * stage.zoom, fx = stage.focus.x;
      const sx = (Math.random() - .5) * stage.shake, sy = (Math.random() - .5) * stage.shake;
      v.cam.position.set(fx + sx, (phone ? 6 : 4.8) * (0.7 + 0.3 * stage.zoom) + sy, z); v.cam.lookAt(fx, 1.0, -0.6);
      if (stage.sun) { stage.sun.position.set(fx + 4, 9, 6); stage.sun.target.position.set(fx, 0, 0); }
      if (stage.stops) stage.stops.forEach(s => {
        tmp.set(s.x + 1.2, 1.75, 1.5).project(v.cam);
        s.el.style.display = tmp.z < 1 && tmp.x > -1.2 && tmp.x < 1.2 ? "" : "none";
        s.el.style.transform = `translate(${(tmp.x + 1) / 2 * r.width}px, ${(1 - tmp.y) / 2 * r.height}px) translate(-50%, -110%)`;
      });
    }
    renderer.render(v.scene, v.cam);
  }
  requestAnimationFrame(frame);
}
frame();
const first = location.hash.slice(1);                 // /crew.html#fed opens Fed's journey
select(ALL.includes(first) ? first : "fed", false);
window.SGM_CREW = { stage, select, replay: startPlay };   // for checking frames by hand
</script>
