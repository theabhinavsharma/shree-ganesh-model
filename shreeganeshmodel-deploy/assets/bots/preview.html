<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGM bots preview</title>
<style>
  :root { --bg: #eef1f4; --ink: #24262b; --chip: rgba(255,255,255,.88); --line: #d5d9df; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; z-index: 2; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  button { font: 600 13px/1 inherit; font-family: inherit; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: #24262b; color: #fff; border-color: #24262b; }
  #status { font-size: 12px; color: #5b616b; }
  .label { font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink);
    background: var(--chip); border: 1px solid var(--line); padding: 3px 6px; border-radius: 6px;
    white-space: nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button id="btnRun" aria-pressed="true">run</button>
  <button id="btnIdle" aria-pressed="false">idle</button>
  <button id="btnPause" aria-pressed="false">pause</button>
  <button id="btnSpin" aria-pressed="false">turntable</button>
  <button id="btnBack" aria-pressed="false">show backs</button>
  <span id="status">loading…</span>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/examples/jsm/renderers/CSS2DRenderer.js';

// URL params (handy for screenshots):
//   ?anim=idle   ?t=0.11 (freeze at this clip time)   ?back=1   ?labels=0
//   ?focus=bot_IN (close-up; tune with fy=look-at height, fd=distance, fx=sideways offset, cam=x,y,z)
const q = new URLSearchParams(location.search);
const ALL = ['bot_IN', 'bot_US', 'bot_DE', 'bot_AE', 'bot_astro',
             'bot_IN_carry', 'bot_US_carry', 'bot_DE_carry', 'bot_AE_carry', 'bot_astro_carry'];
const NAMES = q.get('only') ? q.get('only').split(',').filter((n) => ALL.includes(n)) : ALL;   // ?only=bot_IN,bot_US
const SPACING = 1.25;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none' });
if (q.get('labels') !== '0') document.body.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
scene.fog = new THREE.Fog(0xeef1f4, 18, 40);

scene.add(new THREE.HemisphereLight(0xffffff, 0xc9d1da, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-4, 9, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 4, bottom: -4, near: 1, far: 30 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(60, 48, 0xdfe3e8, 0xe7eaee);
grid.position.y = 0.001;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const rowWidth = (NAMES.length - 1) * SPACING;
function frameRow() {
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const dist = (rowWidth / 2 + 0.9) / Math.tan(hfov / 2);
  camera.position.set(0, 0.22 * dist, dist);
  controls.target.set(0, 0.55, 0);
}
frameRow();

const mixers = [], bots = {};
let clipName = q.get('anim') === 'idle' ? 'idle' : 'run';
let paused = q.has('t'), spin = false, showBack = q.get('back') === '1';
const loader = new GLTFLoader();
let loaded = 0;
const status = document.getElementById('status');

NAMES.forEach((name, i) => {
  loader.load(`./${name}.glb`, (gltf) => {
    const obj = gltf.scene;
    obj.position.x = (i - (NAMES.length - 1) / 2) * SPACING;
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const holder = new THREE.Group();
    holder.position.copy(obj.position);
    obj.position.set(0, 0, 0);
    holder.add(obj);
    scene.add(holder);
    const div = document.createElement('div');
    div.className = 'label';
    div.textContent = name;
    const lab = new CSS2DObject(div);
    lab.position.set(0, -0.16, 0.5);
    holder.add(lab);
    const mixer = new THREE.AnimationMixer(obj);
    const clips = Object.fromEntries(gltf.animations.map((c) => [c.name, c]));
    bots[name] = { holder, obj, mixer, clips };
    mixers.push(mixer);
    play(name);
    loaded++;
    status.textContent = `${loaded}/${NAMES.length} loaded · clips: ${gltf.animations.map((c) => `${c.name} ${c.duration.toFixed(2)}s`).join(', ')}`;
    if (loaded === NAMES.length) onAllLoaded();
  }, undefined, (err) => { status.textContent = `failed to load ${name}: ${err.message || err}`; console.error(err); });
});

function play(name) {
  const b = bots[name];
  b.mixer.stopAllAction();
  const action = b.mixer.clipAction(b.clips[clipName]);
  action.reset().play();
  if (q.has('t')) b.mixer.setTime(parseFloat(q.get('t')) || 0);
}
function setClip(c) {
  clipName = c;
  Object.keys(bots).forEach(play);
  document.getElementById('btnRun').setAttribute('aria-pressed', String(c === 'run'));
  document.getElementById('btnIdle').setAttribute('aria-pressed', String(c === 'idle'));
}
function applyFacing() {
  Object.values(bots).forEach((b) => { b.obj.rotation.y = showBack ? Math.PI : 0; });
  document.getElementById('btnBack').setAttribute('aria-pressed', String(showBack));
}
function onAllLoaded() {
  applyFacing();
  const f = q.get('focus');
  if (f && bots[f]) {
    const p = bots[f].holder.position;
    const h = parseFloat(q.get('fy') || '0.5');      // look-at height
    const d = parseFloat(q.get('fd') || '2.4');      // camera distance
    const sx = parseFloat(q.get('fx') || '0.35');    // sideways offset (3/4 view)
    camera.fov = 30; camera.updateProjectionMatrix();
    camera.position.set(p.x + sx, h + 0.25 * d / 2.4, d);   // ?back=1 turns the bots, not the camera
    if (q.get('cam')) {                               // ?cam=x,y,z camera offset from the bot (e.g. side view 3,0.3,0)
      const [cx, cy, cz] = q.get('cam').split(',').map(Number);
      camera.position.set(p.x + cx, h + cy, cz);
    }
    controls.target.set(p.x, h, 0);
  }
  document.body.dataset.ready = '1';
}
document.getElementById('btnRun').onclick = () => setClip('run');
document.getElementById('btnIdle').onclick = () => setClip('idle');
document.getElementById('btnPause').onclick = (e) => { paused = !paused; e.target.setAttribute('aria-pressed', String(paused)); };
document.getElementById('btnSpin').onclick = (e) => { spin = !spin; e.target.setAttribute('aria-pressed', String(spin)); };
document.getElementById('btnBack').onclick = () => { showBack = !showBack; applyFacing(); };
document.getElementById('btnPause').setAttribute('aria-pressed', String(paused));
if (clipName === 'idle') setClip('idle');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labels.setSize(innerWidth, innerHeight);
  if (!q.get('focus')) frameRow();
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (!paused) mixers.forEach((m) => m.update(dt));
  if (spin) Object.values(bots).forEach((b) => { b.holder.rotation.y += dt * 0.8; });
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
window.__bots = { bots, setClip, camera, controls, THREE };
</script>
</body>
</html>
