<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGM sets preview</title>
<style>
  :root { --bg: #e9eef2; --ink: #24262b; --chip: rgba(255,255,255,.88); --line: #d5d9df; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; z-index: 2; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  button { font: 600 13px/1 inherit; font-family: inherit; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: #24262b; color: #fff; border-color: #24262b; }
  #status { font-size: 12px; color: #5b616b; }
  .label { font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink);
    background: var(--chip); border: 1px solid var(--line); padding: 2px 5px; border-radius: 5px; white-space: nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button id="btnIdle" aria-pressed="true">idle</button>
  <button id="btnAction" aria-pressed="false">action (work / hit / buzz / flip)</button>
  <button id="btnPause" aria-pressed="false">pause</button>
  <span id="status">loading…</span>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/examples/jsm/renderers/CSS2DRenderer.js';

// Everything at true scale (a bot is 1.0 tall). Back row: buildings; front row: props and dressing.
// URL params: ?anim=action  ?t=0.1 (freeze)  ?labels=0  ?focus=anvil (close-up; fd=distance, fy=height, cam=x,y,z)
const q = new URLSearchParams(location.search);
const BACK = ['nse_plaza', 'fed_stl', 'ecb_tower', 'pib_office', 'sbi_bank', 'port_crane', 'telegram_tower', 'cable_landing'];
const FRONT = ['desk', 'anvil', 'list_scroll', 'phone_stand', 'calendar', 'broker_desk', 'palm_tree', 'oak_tree', 'rock', 'lamp_post', 'bench', 'bush'];
const ACTION = { port_crane: 'work', phone_stand: 'buzz', calendar: 'flip', anvil: 'hit' };
// Characters placed relative to a set piece: [file, anchor, x, z, yaw (deg), idle clip, action clip]
const CAST = [
  ['../props/laptop_giant.glb', 'desk', 0.0, -0.05, 0, 'idle', 'idle', 0.84],
  ['../bots/bot_IN.glb', 'desk', 1.8, 0.35, -20, 'idle', 'cheer'],
  ['../props/bot_ML.glb', 'anvil', 0.415, -0.464, 0, 'idle', 'hammer'],
  ['../bots/bot_US.glb', 'phone_stand', -0.95, 0.35, 25, 'idle', 'jump'],
  ['../bots/bot_DE_carry.glb', 'calendar', 1.05, 0.2, -15, 'idle', 'cheer'],
  ['../props/me_figure.glb', 'broker_desk', 1.15, 0.3, -20, 'idle', 'wave'],
];
const GAP_BACK = 0.9, GAP_FRONT = 1.45, Z_BACK = -3.6, Z_FRONT = 2.6;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none' });
if (q.get('labels') !== '0') document.body.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9eef2);
scene.add(new THREE.HemisphereLight(0xffffff, 0xc4ccd4, 1.45));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(-12, 22, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 14, bottom: -14, near: 1, far: 80 });
sun.shadow.bias = -0.0004;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 60), new THREE.MeshStandardMaterial({ color: 0xa9cf8f, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const water = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 3.4), new THREE.MeshStandardMaterial({ color: 0x5aa9d6, roughness: 0.3 }));
water.rotation.x = -Math.PI / 2;
water.position.y = 0.002;
scene.add(water);

const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let mode = q.get('anim') === 'action' ? 'action' : 'idle';
let paused = q.has('t');
const loader = new GLTFLoader();
const sets = {}, actors = [];
const status = document.getElementById('status');
const load = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

function addLabel(obj, text, y) {
  if (q.get('labels') === '0') return;
  const div = document.createElement('div');
  div.className = 'label';
  div.textContent = text;
  const lab = new CSS2DObject(div);
  lab.position.set(0, y, 0);
  obj.add(lab);
}
function prep(gltf) {
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const clips = Object.fromEntries(gltf.animations.map((c) => [c.name, c]));
  return { obj: gltf.scene, mixer, clips };
}
function layRow(names, z, gap) {
  const widths = names.map((n) => new THREE.Box3().setFromObject(sets[n].obj).getSize(new THREE.Vector3()).x);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (names.length - 1);
  let x = -total / 2;
  names.forEach((n, i) => {
    sets[n].obj.position.set(x + widths[i] / 2, 0, z);
    x += widths[i] + gap;
    addLabel(sets[n].obj, n, -0.15);
  });
  return total;
}
function play(a) {
  const name = mode === 'action' ? a.action : a.idle;
  a.mixer.stopAllAction();
  const clip = a.clips[name] || a.clips.idle;
  const act = a.mixer.clipAction(clip);
  if (clip.name === 'buzz') { act.setLoop(THREE.LoopOnce); act.clampWhenFinished = true; }
  act.reset().play();
  if (q.has('t')) a.mixer.setTime(parseFloat(q.get('t')) || 0);
}
function setMode(m) {
  mode = m;
  actors.forEach(play);
  document.getElementById('btnIdle').setAttribute('aria-pressed', String(m === 'idle'));
  document.getElementById('btnAction').setAttribute('aria-pressed', String(m === 'action'));
}

(async () => {
  const all = [...BACK, ...FRONT];
  const gl = await Promise.all(all.map((n) => load(`./${n}.glb`)));
  all.forEach((n, i) => {
    const s = prep(gl[i]);
    sets[n] = s;
    scene.add(s.obj);
    actors.push({ ...s, idle: 'idle', action: ACTION[n] || 'idle' });
  });
  const wBack = layRow(BACK, Z_BACK, GAP_BACK);
  layRow(FRONT, Z_FRONT, GAP_FRONT);
  const cport = sets.port_crane.obj.position, cland = sets.cable_landing.obj.position;
  water.position.set((cport.x + cland.x) / 2 + 0.6, 0.002, Z_BACK + 3.2);
  const cast = await Promise.all(CAST.map((c) => load(c[0])));
  CAST.forEach((c, i) => {
    const s = prep(cast[i]);
    const anchor = sets[c[1]].obj.position;
    s.obj.position.set(anchor.x + c[2], c[7] || 0, anchor.z + c[3]);
    s.obj.rotation.y = THREE.MathUtils.degToRad(c[4]);
    scene.add(s.obj);
    actors.push({ ...s, idle: c[5], action: c[6] });
  });
  actors.forEach(play);
  const f = q.get('focus');
  if (f && sets[f]) {
    const p = sets[f].obj.position;
    const h = parseFloat(q.get('fy') || '0.8'), d = parseFloat(q.get('fd') || '4');
    camera.position.set(p.x + 0.6, h + 0.8, p.z + d);
    if (q.get('cam')) {
      const [cx, cy, cz] = q.get('cam').split(',').map(Number);
      camera.position.set(p.x + cx, h + cy, p.z + cz);
    }
    controls.target.set(p.x, h, p.z);
  } else {
    const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
    const dist = (wBack / 2 + 1.0) / Math.tan(hfov / 2);
    camera.position.set(0, dist * 0.42, Z_FRONT + dist * 0.82);
    controls.target.set(0, 1.4, -0.4);
  }
  status.textContent = `${all.length} sets + ${CAST.length} characters loaded`;
  document.body.dataset.ready = '1';
})().catch((e) => { status.textContent = 'load failed: ' + (e.message || e); console.error(e); });

document.getElementById('btnIdle').onclick = () => setMode('idle');
document.getElementById('btnAction').onclick = () => setMode('action');
document.getElementById('btnPause').onclick = (e) => { paused = !paused; e.target.setAttribute('aria-pressed', String(paused)); };
document.getElementById('btnPause').setAttribute('aria-pressed', String(paused));
if (mode === 'action') setMode('action');
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labels.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (!paused) actors.forEach((a) => a.mixer.update(dt));
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
window.__sets = { sets, actors, setMode, camera, controls, THREE };
</script>
</body>
</html>
