<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SGM Data World</title>
<meta name="description" content="Where every number in the Shree Ganesh Model's Friday list comes from: a real Earth, real buildings, and little bots carrying the data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="world/style.css">
<script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
<script src="world/config.js" onerror="window.SGM_CONFIG = window.SGM_CONFIG || {}"></script>
<script src="world/data.js"></script>
</head>
<body>
<div id="cesium" aria-label="3D Earth showing where SGM's data comes from"></div>

<header class="brand">
  <h1>SGM Data World</h1>
  <p id="sunline" class="sun" aria-live="polite"></p>
</header>
<nav class="topnav" aria-label="Site">
  <a class="pill" href="/older-models/">Older Models</a>
</nav>

<section id="intro" class="intro" aria-labelledby="introTitle">
  <h2 id="introTitle">Where every number in your Friday list comes from</h2>
  <p>A real Earth, real buildings, and little bots that carry the data home to a laptop in Bengaluru.</p>
  <div class="row">
    <button id="startBtn" class="pill primary" type="button">Start the journey</button>
    <button id="exploreBtn" class="pill" type="button">Explore on my own</button>
  </div>
</section>

<section id="caption" class="caption" hidden aria-live="polite">
  <p id="captionText"></p>
  <div class="row">
    <button id="nextBtn" class="pill primary" type="button">Next</button>
    <button id="skipBtn" class="pill" type="button">Skip to exploring</button>
  </div>
</section>

<nav id="chips" class="chips" hidden aria-label="Fly to"></nav>
<aside id="card" class="card" hidden aria-live="polite"></aside>
<div id="note" class="note" hidden></div>

<script src="world/app.js"></script>
</body>
</html>
